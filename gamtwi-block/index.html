<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>감튀블록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf7ec; --ink:#3c504a; --muted:#8b968e; --green:#47625a; --green-d:#33473f;
    --panel:#edf0df; --card:#fbf8f0; --line:#e5e0cd; --tile:#f3eee2; --surface:#fffdf8; --hover:#fff;
    --shadow:rgba(60,80,74,.14);
  }
  :root[data-theme="night"]{
    --bg:#11151c; --ink:#ece6d6; --muted:#8d95a0; --green:#5c7f72; --green-d:#3e5a50;
    --panel:#1a2029; --card:#1b212a; --line:#2c3440; --tile:#242c37; --surface:#1f2630; --hover:#2c3542;
    --shadow:rgba(0,0,0,.45);
  }
  body,.pill,.panel .card,.tile,.selbar,#squeezeTip,.examples button,.chip{transition:background-color .6s, color .6s, border-color .6s}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

  .top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 22px 0;pointer-events:none;z-index:5}
  .top > *{pointer-events:auto}
  .brand{font-weight:500;font-size:17px}
  .top-actions{display:flex;gap:8px}
  .pill{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;height:36px;padding:0 12px;
    font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
  .pill:active{transform:scale(.96)}
  .pill svg{width:16px;height:16px}
  .pill[disabled]{opacity:.4;pointer-events:none}
  .pill:not(#gravBtn){padding:0 10px}
  .pill .lbl{font-size:13px;font-weight:600;white-space:nowrap}
  .brand{white-space:nowrap}
  @media (max-width:520px){ #clearBtn .lbl{display:none} #gravBtn{padding:0 8px} .top-actions{gap:4px !important} .pill:not(#gravBtn){padding:0 8px} .brand{font-size:15px} }
  .pill.off{color:var(--muted)}
  .pill.off svg{opacity:.45}
  .pill .sw{position:relative;width:28px;height:16px;border-radius:8px;background:var(--green);margin-left:2px;flex:0 0 auto;transition:background-color .2s}
  .pill .sw i{position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
  .pill.off .sw{background:var(--muted);opacity:.55}
  .pill.off .sw i{left:2px}

  #hint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);
    font-size:13.5px;color:var(--muted);text-align:center;line-height:1.6;transition:opacity .5s;z-index:4;
    white-space:nowrap;pointer-events:none}
  #hint b{color:var(--ink);font-weight:700}
  .keys{display:block;font-size:12px;opacity:.85}
  @media (pointer:coarse){.keys{display:none}}

  #squeezeTip{position:fixed;left:calc(50% - var(--rail)/2 - 12px);bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%, 12px);
    z-index:8;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;font-size:13.5px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .15s, transform .2s;white-space:nowrap}
  #squeezeTip.show{opacity:1;pointer-events:auto;transform:translate(-50%, 0)}
  #squeezeTip b{color:#b8231b}
  #squeezeTip button{height:32px;padding:0 12px;border-radius:9px;background:#c4392b;color:#fff;font-weight:700;font-size:13px}
  body:has(#squeezeTip.show) .kcal{opacity:0}
  .tile.on{border-color:#c4392b;background:var(--hover)}
  .kcal{position:fixed;right:24px;z-index:4;font-family:Outfit,sans-serif;font-weight:700;font-size:48px;
    letter-spacing:-.5px;line-height:1;pointer-events:none;bottom:0}
  .kcal small{font-size:30px;margin-left:2px}
  .kcal{transition:opacity .2s}

  .panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:32px 32px 0 0;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:6}
  .card{max-width:560px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:28px;
    padding:16px 16px 18px;box-shadow:0 10px 30px rgba(60,80,74,.06)}
  .pieces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tile{background:var(--tile);border-radius:16px;padding:6px 2px 8px;display:flex;flex-direction:column;
    align-items:center;gap:2px;border:2px solid transparent;transition:transform .15s, background .15s, border-color .15s;position:relative}
  .tile img{width:58px;height:58px;display:block;pointer-events:none}
  .tile span{font-size:12.5px;font-weight:500;white-space:nowrap}
  .tile .num{position:absolute;top:5px;left:8px;font-size:10px;color:var(--muted);font-family:Outfit}
  @media (pointer:coarse){.tile .num{display:none}}
  .tile:focus{outline:none}
  .tile:hover{transform:translateY(-2px);background:var(--hover)}
  .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .seg{display:flex;align-items:center;background:var(--tile);border-radius:12px;height:40px;flex:1 1 auto;min-width:150px}
  .seg button{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
  .seg button:active{background:#e8e2d2}
  .seg svg{width:18px;height:18px}
  .seg span{flex:1;text-align:center;font-size:13.5px;font-weight:500;white-space:nowrap}
  .chip{background:var(--tile);border-radius:12px;height:40px;padding:0 14px;font-size:13.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;border:2px solid transparent;transition:all .15s;flex:0 0 auto}
  .chip svg{width:17px;height:17px}
  .chip.on{background:var(--green);color:#fff}
  .chip.danger.on{background:#c4574a}
  .chip:active{transform:scale(.96)}
  .examples{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--muted)}
  .examples .lbl{margin-right:4px}
  .examples button{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;background:var(--surface)}
  .examples button:active{transform:scale(.96)}
  .primary{display:flex;width:100%;height:56px;margin-top:14px;align-items:center;justify-content:center;gap:8px;
    background:var(--green);color:#fff;border-radius:18px;font-size:17px;font-weight:700;
    box-shadow:0 6px 0 var(--green-d);transition:transform .08s, box-shadow .08s;margin-bottom:6px}
  .primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
  .primary[disabled]{opacity:.45;pointer-events:none}
  .primary svg{width:20px;height:20px}

  .tiphint{flex:1 1 auto;font-size:12.5px;line-height:1.45;color:var(--muted);align-self:center;min-width:0}
  .tiphint b{color:var(--ink);font-weight:700}
  .tools{align-items:center}
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .15s;will-change:transform}
  .tile.tap{animation:tap .32s}
  @keyframes tap{30%{transform:translateY(3px) scale(.94)}70%{transform:translateY(-3px)}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .45s}
  #flash.on{opacity:.85;transition:none}
  #toast{position:fixed;left:calc(50% - var(--rail)/2 - 12px);top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:31;
    background:var(--green);color:#fff;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(253,247,236,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.show{opacity:1;pointer-events:auto}
  .modal .sheet{width:100%;background:var(--panel);border-radius:32px 32px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
  .modal.show .sheet{transform:none}
  .modal .card{text-align:center;padding:30px 24px 22px}
  .modal h2{margin:0 0 14px;font-size:26px;font-weight:800;letter-spacing:-.3px}
  .modal p{margin:0 0 26px;color:var(--muted);font-size:14.5px}
  .modal .rec{display:flex;justify-content:center;gap:22px;font-size:15px;margin-bottom:20px}
  .modal .rec b{font-family:Outfit;font-size:18px}
  .bigcount{font-family:Outfit;font-weight:700;font-size:56px;line-height:1;margin:6px 0 10px}
  .bigcount small{font-size:30px}

  @media (max-width:520px){
    .top{padding-left:16px;padding-right:12px}
    .pill .tx{display:none}
    .pill{padding:0 10px}
    .kcal{font-size:40px;right:18px}
    .kcal small{font-size:24px}
    .tile img{width:48px;height:48px}
    .tile span{font-size:11.5px}
    .pieces{gap:6px}
    .card{padding:12px 12px 14px;border-radius:24px}
    .panel{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
    .chip{padding:0 11px}
    .chip .tx2{display:none}
    .primary{height:52px}
  }
  /* ---- side rail layout ---- */
  :root{--rail:112px}
  .panel{left:auto;right:0;top:0;bottom:0;width:calc(var(--rail) + 24px);border-radius:0;
    padding:calc(66px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) 12px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:10px;background:transparent;pointer-events:none}
  .panel .sect{text-align:center;margin:2px 0 0;font-size:11.5px;color:var(--muted)}
  .panel .card{pointer-events:auto;box-shadow:0 12px 32px rgba(60,80,74,.10)}
  .panel .card{width:100%;max-width:none;margin:0;padding:10px 8px;border-radius:22px;display:flex;flex-direction:column;gap:8px;
    flex:0 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}
  .panel .card::-webkit-scrollbar{display:none}
  .pieces{grid-template-columns:1fr;gap:6px}
  .tile{padding:6px 2px 7px;border-radius:14px}
  .tile img{width:54px;height:54px}
  .rule{height:1px;background:var(--line);margin:2px 4px}
  .panel .chip{justify-content:center;height:38px;padding:0;width:100%;font-size:13px}
  .panel .examples{flex-direction:column;align-items:stretch;gap:5px;margin:0}
  .panel .examples .lbl{text-align:center;margin:2px 0 0;font-size:11.5px}
  .panel .examples button{padding:6px 0;font-size:12.5px}
  .panel .primary{pointer-events:auto;flex:0 0 auto;height:56px;margin:0;border-radius:18px;font-size:15px;flex-direction:column;gap:0;line-height:1.1;box-shadow:0 4px 0 var(--green-d), 0 12px 28px rgba(60,80,74,.18)}
  .panel .primary svg{width:18px;height:18px}
  .kcal{right:auto;left:22px;bottom:calc(18px + env(safe-area-inset-bottom)) !important}
  #hint{left:calc(50% - var(--rail)/2 - 12px)}
  @media (max-width:520px){
    :root{--rail:76px}
    .panel{padding-left:8px;padding-right:8px;width:calc(var(--rail) + 16px)}
    .panel .card{padding:8px 5px;border-radius:18px;gap:6px}
    .tile{padding:5px 0 6px;border-radius:12px}
    .tile img{width:42px;height:42px}
    .tile span{font-size:10.5px}
    .panel .chip span{display:none}
    .panel .examples button{font-size:11.5px}
    .panel .primary{height:46px;font-size:13px}
    .kcal{font-size:36px;left:16px}
    .kcal small{font-size:22px}
    #hint{font-size:12.5px}
  }
  .selbar{position:fixed;left:calc(50% - var(--rail)/2 - 12px);bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;
    display:flex;align-items:center;gap:2px;padding:4px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);
    opacity:0;pointer-events:none;transform:translate(-50%, 12px);transition:opacity .15s, transform .2s}
  .selbar.show{opacity:1;pointer-events:auto;transform:translate(-50%, 0)}
  .selbar.show.drag{opacity:.35;pointer-events:none}
  .selbar button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
  .selbar button:hover{background:var(--tile)}
  .selbar button:active{transform:scale(.92)}
  .selbar svg{width:19px;height:19px}
  .selbar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
  .selbar .txt{width:auto;padding:0 10px;display:flex;gap:5px;font-size:13px;font-weight:700;white-space:nowrap}
  .selbar .on{background:var(--green);color:#fff}
  .selbar .mode{margin-right:1px}
  .selbar .on:hover{background:var(--green-d)}
  .selbar .danger{color:#b54b3f}
  .selbar .danger:hover{background:#f7e3df}
  .selbar .scrub{touch-action:none;cursor:ew-resize}
  .selbar .scrub.drag{background:var(--green);color:#fff}
  .selbar .close{background:none;color:var(--ink);opacity:.6}
  .selbar .close:hover{background:none;opacity:1}
  @media (max-width:760px){
    .selbar .txt span{display:none}
    .selbar .txt{padding:0;width:38px;justify-content:center}
  }
  @media (max-width:520px){
    .selbar,.selbar.show{left:8px;right:calc(var(--rail) + 22px);transform:none;gap:0;padding:3px}
    .selbar{transform:translateY(12px)}
    body:has(.selbar.show) .kcal{opacity:0}
    .selbar button,.selbar .txt{flex:1 1 0;width:auto;min-width:0;height:38px}
    .selbar .sep{margin:0 1px}
    .selbar .ok{flex:0 0 auto;padding:0 8px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<header class="top">
  <div class="brand">감튀블록</div>
  <div class="top-actions">
    <button class="pill" id="undoBtn" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="pill" id="redoBtn" title="앞으로 (Ctrl+Shift+Z)" aria-label="앞으로" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button class="pill" id="clearBtn" title="비우기" aria-label="비우기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg><span class="lbl">비우기</span>
    </button>
    <button class="pill" id="gravBtn" title="중력 (G)" aria-pressed="true">
      <span class="lbl">중력</span><span class="sw" aria-hidden="true"><i></i></span>
    </button>
    <button class="pill" id="nightBtn" title="야간 모드 (N)">
      <svg id="icMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg id="icSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="pill" id="soundBtn" title="소리">
      <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
  </div>
</header>


<div id="squeezeTip"><b>케첩 모드</b> <button id="sqDone">종료</button></div>

<div class="kcal" id="kcal"><span id="kcalNum">0</span><small> kcal</small></div>

<section class="panel" id="panel">
  <div class="card">
    <span class="sect">재료 추가</span>
    <div class="pieces" id="pieces"></div>
    <div class="rule"></div>
    <div class="examples">
      <span class="lbl">예시</span>
      <button data-ex="dino">트리케라톱스</button>
      <button data-ex="stego">스테고사우루스</button>
      <button data-ex="giraffe">기린</button>
      <button data-ex="car">자동차</button>
    </div>
  </div>
  <button class="primary" id="saveBtn" disabled title="사진 촬영 (P)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><span>촬영</span>
  </button>
</section>


<div class="selbar" id="selActs">
  <button class="txt mode on" data-mode="move" title="이동 (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><span>이동</span></button>
  <button class="txt mode" data-mode="rotate" title="회전 (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>회전</span></button>
  <button class="txt mode" data-mode="scale" title="크기 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><span>크기</span></button>
  <span class="sep"></span>
  <button data-act="dup" title="복제 (D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
  <button class="danger" data-act="del" title="빼기 (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>
  <span class="sep"></span>
  <button data-act="done" class="close" title="닫기 (Esc)" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="flash"></div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const Y = new THREE.Vector3(0, 1, 0);
const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const newSeed = () => (Math.random() * 1e9) | 0;
function noise3(x, y, z, o){
  return ( Math.sin(x*1.7+o[0])*Math.sin(y*2.3+o[1])*Math.sin(z*1.9+o[2])
         + Math.sin(x*3.1+y*1.3+o[3])*0.5 + Math.sin(z*2.7-x*1.1+o[4])*0.5
         + Math.sin(y*3.7+z*1.7+o[5])*0.35 ) / 2.35;
}

/* ---------- materials ---------- */
const bumpU = { value: 1 };     // crumb relief strength (softened at night so the crust doesn't look like black blotches)
const deepU = { value: 0.26 };   // how much deeper cast shadows get (day only)
const fryMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.6, metalness:0 });
const nugMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.9, metalness:0 });
const ketMat = new THREE.MeshPhysicalMaterial({ color:0xb8231b, roughness:0.2, clearcoat:0.8, clearcoatRoughness:0.15 });
const eraseMat = new THREE.MeshStandardMaterial({ color:0xd8695b, roughness:0.6, transparent:true, opacity:0.85 });

/* ---------- geometry ---------- */
const FRY_W = 0.17;
const CURVES = {
  long:  new THREE.LineCurve3(new THREE.Vector3(0,0,0), new THREE.Vector3(0,2.0,0)),
  short: new THREE.LineCurve3(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1.15,0)),
  bent:  new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,0,0), new THREE.Vector3(0,1.55,0), new THREE.Vector3(0.95,1.8,0)),
  stub:  new THREE.LineCurve3(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0.72,0)),   // a stubby leg
  horn:  new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0.45,0), new THREE.Vector3(0.06,0.8,0)),   // a short stubby pointy fry
  tip:   new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0.8,0), new THREE.Vector3(0.12,1.45,0)),   // the pointy end of the potato
};

function makeFryGeo(curve, seed, taper = false){
  const rnd = mulberry32(seed);
  const tStart = 0.38 + rnd()*0.2, tipR = 0.3 + rnd()*0.15, skew = (rnd() < 0.5 ? -1 : 1)*(0.2 + rnd()*0.35);
  const SEG = curve.isLineCurve3 ? 14 : 30, P = 16, ex = 2/5;
  const frames = curve.computeFrenetFrames(SEG, false);
  const pos = [], col = [], idx = [];
  const cBase = new THREE.Color(0xf2bc45), cEnd = new THREE.Color(0xbb7623), c = new THREE.Color();
  const tint = (rnd()-0.5)*0.08;
  const w = FRY_W * (0.92 + rnd()*0.16);
  const twist = (rnd()-0.5)*0.4;
  for (let i = 0; i <= SEG; i++){
    const t = i/SEG, p = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    const rr = 1 + (rnd()-0.5)*0.05;
    // a tapered fry narrows (a bit off-centre, like a knife-cut potato end) into a soft rounded point
    let tk = 1, off = 0, exT = ex;
    if (taper && t > tStart){ const k = (t - tStart)/(1 - tStart), e = k*k*(3 - 2*k); tk = 1 - (1 - tipR)*e; off = skew*(1 - tk)*w*0.35; exT = ex + (1 - ex)*e*0.8; }
    const endF = Math.pow(Math.abs(2*t-1), 10);
    c.copy(cBase).lerp(cEnd, Math.min(1, endF*0.75 + rnd()*0.05 + Math.max(0,tint)));
    if (tint < 0) c.offsetHSL(0, 0, -tint*0.4);
    for (let j = 0; j < P; j++){
      const a = j/P*Math.PI*2 + twist*t, cs = Math.cos(a), sn = Math.sin(a);
      const x = Math.sign(cs)*Math.pow(Math.abs(cs), exT)*w/2*rr*tk + off;
      const y = Math.sign(sn)*Math.pow(Math.abs(sn), exT)*w/2*rr*tk;
      pos.push(p.x+N.x*x+B.x*y, p.y+N.y*x+B.y*y, p.z+N.z*x+B.z*y);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < SEG; i++) for (let j = 0; j < P; j++){
    const a = i*P+j, b = i*P+(j+1)%P, cc = (i+1)*P+j, d = (i+1)*P+(j+1)%P;
    idx.push(a, b, cc, b, d, cc);
  }
  // caps
  const t0 = curve.getTangentAt(0), t1 = curve.getTangentAt(1);
  const p0 = curve.getPointAt(0).addScaledVector(t0, -0.035), p1 = curve.getPointAt(1).addScaledVector(t1, taper ? 0.012 : 0.035);
  if (taper){ const N1 = frames.normals[SEG]; p1.addScaledVector(N1, skew*(1 - tipR)*w*0.35); }
  const c0 = pos.length/3; pos.push(p0.x,p0.y,p0.z); col.push(cEnd.r,cEnd.g,cEnd.b);
  const c1 = pos.length/3; pos.push(p1.x,p1.y,p1.z); col.push(cEnd.r,cEnd.g,cEnd.b);
  for (let j = 0; j < P; j++){
    idx.push(c0, (j+1)%P, j);
    idx.push(c1, SEG*P+j, SEG*P+(j+1)%P);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeNuggetGeo(seed){
  const rnd = mulberry32(seed);
  // 2D silhouette: smooth union of a few discs (bell, boot, ball, bone)
  const SHAPES = [
    [[0,0.05,0.62],[0,-0.42,0.42],[0.38,-0.38,0.22],[-0.38,-0.38,0.22]],              // bell
    [[-0.12,0.12,0.5],[0.3,-0.3,0.42],[0.62,-0.4,0.3]],                                 // boot
    [[0,0,0.6],[0.18,0.12,0.45]],                                                       // ball
    'bone',
  ];
  const pickN = Math.floor(rnd()*(SHAPES.length + 1));   // bone comes up a little more often
  const base = SHAPES[Math.min(pickN, SHAPES.length - 1)];
  const K = 9;
  let field, discs;
  if (base === 'bone'){
    // a chunky rounded block, a touch narrower in the middle, ends slightly uneven
    const hx = 0.66 + rnd()*0.08, hy = 0.42 + rnd()*0.06, rc = 0.2 + rnd()*0.06, waist = 0.05 + rnd()*0.04, skew = (rnd() - 0.5)*0.12;
    field = (x, y) => {
      const yy = y - skew*x;
      const qx = Math.abs(x) - (hx - rc), qy = Math.abs(yy) - (hy - rc)*(1 + 0.08*Math.sign(x)*Math.sign(skew || 1));
      const d = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - rc;
      return d + waist*Math.exp(-(x*x)/0.05)*Math.min(1, Math.abs(yy)/hy*1.4);
    };
    discs = [[0, 0, 0.5]];
  } else {
    discs = base.map(([x,y,r]) => [x + (rnd()-0.5)*0.08, y + (rnd()-0.5)*0.08, r*(0.92 + rnd()*0.14)]);
    field = (x, y) => { let s = 0; for (const [cx,cy,r] of discs) s += Math.exp(-K*(Math.hypot(x-cx, y-cy) - r)); return -Math.log(s)/K; };
  }
  let cx = 0, cy = 0, wsum = 0;
  for (const [x,y,r] of discs) { cx += x*r*r; cy += y*r*r; wsum += r*r; }
  cx /= wsum; cy /= wsum;
  const NA = 256, R = new Float32Array(NA);
  for (let i = 0; i < NA; i++){
    const a = i/NA*Math.PI*2, dx = Math.cos(a), dy = Math.sin(a);
    let t = 0; while (t < 2 && field(cx + dx*t, cy + dy*t) < 0) t += 0.01;
    R[i] = t;
  }
  const Rat = a => { const f = ((a/(Math.PI*2))%1 + 1)%1*NA, i = Math.floor(f), k = f - i; return R[i%NA]*(1-k) + R[(i+1)%NA]*k; };
  const scale = 0.94 + rnd()*0.07;            // overall size
  const thick = 0.3 + rnd()*0.04;             // half thickness
  const rot = rnd()*Math.PI*2;

  let g = new THREE.SphereGeometry(1, 150, 90);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  const o1 = Array.from({length:6}, () => rnd()*10), o2 = Array.from({length:6}, () => rnd()*10);
  const cHi = new THREE.Color(0xf0b961), cMid = new THREE.Color(0xdf9638), cLo = new THREE.Color(0xb96a22), c = new THREE.Color();
  const col = [];
  let maxX = 0, maxZ = 0;
  for (let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    const rho = Math.hypot(v.x, v.z), a = Math.atan2(v.z, v.x);
    const Rr = Rat(a + rot) * scale;
    // pillow cross-section: flat-ish faces, round rim
    const yy = Math.sign(v.y)*Math.pow(Math.abs(v.y), 0.72);
    const rr = Math.pow(rho, 0.85);
    let x = Math.cos(a)*rr*Rr, z = Math.sin(a)*rr*Rr, y = yy*thick*(0.9 + 0.1*rr);
    // gentle lumps + breading crumbs
    const lo = noise3(x*3, y*3, z*3, o1), hi = noise3(x*14, y*14, z*14, o2);
    const disp = 0.03*lo + 0.008*hi;
    const nx = Math.cos(a)*rho, ny = v.y*2.2, nz = Math.sin(a)*rho, nl = Math.hypot(nx, ny, nz) || 1;
    x += nx/nl*disp; y += ny/nl*disp; z += nz/nl*disp;
    p.setXYZ(i, x, y, z);
    maxX = Math.max(maxX, Math.abs(x)); maxZ = Math.max(maxZ, Math.abs(z));
    // rim browns more than the flat faces
    const rim = Math.pow(1 - Math.abs(v.y), 3);
    c.copy(cMid).lerp(cHi, THREE.MathUtils.clamp(0.35 + lo*0.6, 0, 1)).lerp(cLo, rim*0.45);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  // sockets for snapping, in local space
  const socks = [{ p:new THREE.Vector3(0, thick, 0), n:new THREE.Vector3(0,1,0) }, { p:new THREE.Vector3(0, -thick, 0), n:new THREE.Vector3(0,-1,0) }];
  for (let i = 0; i < 8; i++){
    const a = i/8*Math.PI*2, r = Rat(a + rot)*scale, r2 = Rat(a + rot + 0.05)*scale, r1 = Rat(a + rot - 0.05)*scale;
    const pt = new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r);
    const t = new THREE.Vector3(Math.cos(a+0.05)*r2 - Math.cos(a-0.05)*r1, 0, Math.sin(a+0.05)*r2 - Math.sin(a-0.05)*r1);
    const n = new THREE.Vector3(t.z, 0, -t.x).normalize(); if (n.dot(pt) < 0) n.negate();
    socks.push({ p: pt.multiplyScalar(0.96), n });
  }
  g.userData = { sockets: socks, ell: [maxX, thick, maxZ] };
  return g;
}

/* crunchy breading + fry surface, done in the shader so it stays crisp up close */
const GLSL_NOISE = `
varying vec3 vObjPos;
float hash3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x), mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x), mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
`;
function patchSurface(mat, kind){
  mat.onBeforeCompile = sh => {
    sh.vertexShader = 'varying vec3 vObjPos;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
    const crust = kind === 'nugget';
    sh.uniforms.uBump = bumpU;
    sh.fragmentShader = 'uniform float uBump;\n' + GLSL_NOISE + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 sp = vObjPos * ${crust ? 'vec3(1.0)' : 'vec3(1.0, 0.12, 1.0)'};
        float pxw = length(fwidth(vObjPos));
        float fade = 1.0 - smoothstep(0.004, 0.018, pxw);
        float hC = ${crust ? 'fbm(sp*9.0)*0.7 + mix(0.5, vnoise(sp*24.0), fade)*0.3' : 'fbm(sp*5.0)'};
        diffuseColor.rgb *= ${crust ? 'mix(0.84, 1.12, smoothstep(0.25, 0.75, hC))' : 'mix(0.97, 1.03, hC)'};
        ${crust ? `
        vec3 cc = floor(vObjPos*26.0), fp = fract(vObjPos*26.0);
        vec3 off = vec3(hash3(cc+1.3), hash3(cc+2.7), hash3(cc+5.9))*0.6 + 0.2;
        float speck = step(0.8, hash3(cc+7.1)) * (1.0 - smoothstep(0.06, 0.11, length(fp - off)));
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16, 0.1, 0.06), speck*0.85*fade);` : ''}`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = ${crust ? 'mix(0.92, 0.62, smoothstep(0.4, 0.8, hC))' : 'mix(0.68, 0.55, hC)'};`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          vec3 dpdx = dFdx(-vViewPosition), dpdy = dFdy(-vViewPosition);
          float hx = dFdx(hC), hy = dFdy(hC);
          vec3 r1 = cross(dpdy, normal), r2 = cross(normal, dpdx);
          float det = dot(dpdx, r1);
          vec3 grad = sign(det) * (hx*r1 + hy*r2);
          normal = normalize(abs(det)*normal - grad * ${crust ? '0.45' : '0.04'} * uBump * (0.35 + 0.65*fade));
        }`);
  };
  mat.customProgramCacheKey = () => 'surf-' + kind;
  return mat;
}
patchSurface(nugMat, 'nugget');
patchSurface(fryMat, 'fry');

function makeKetchupGeo(seed){
  const rnd = mulberry32(seed);
  let g = new THREE.SphereGeometry(1, 32, 20);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3(), o = Array.from({length:6}, () => rnd()*10);
  const s = 0.85 + rnd()*0.35;
  for (let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    v.multiplyScalar(1 + 0.12*noise3(v.x*2.5, v.y*2.5, v.z*2.5, o));
    p.setXYZ(i, v.x*0.11*s, Math.max(v.y, -0.3)*0.06*s, v.z*0.11*s);
  }
  g.computeVertexNormals();
  return g;
}

function makeOnionGeo(seed){
  const rnd = mulberry32(seed);
  const R = 0.4 + rnd()*0.06, r = 0.12 + rnd()*0.02;
  let g = new THREE.TorusGeometry(R, r, 28, 72);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3(), c0 = new THREE.Vector3();
  const o1 = Array.from({length:6}, () => rnd()*10), o2 = Array.from({length:6}, () => rnd()*10);
  const ov = 1 + (rnd()-0.5)*0.12;   // slightly oval ring
  const cHi = new THREE.Color(0xf3cf86), cMid = new THREE.Color(0xe2a952), cLo = new THREE.Color(0xc4823a), c = new THREE.Color();
  const col = [];
  for (let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    c0.set(v.x, v.y, 0).setLength(R);                       // nearest point on the ring's centre line
    const n = v.clone().sub(c0).normalize();
    const lo = noise3(v.x*4, v.y*4, v.z*4, o1), hi = noise3(v.x*15, v.y*15, v.z*15, o2);
    v.addScaledVector(n, 0.028*lo + 0.008*hi);
    v.x *= ov;
    p.setXYZ(i, v.x, v.y, v.z);
    c.copy(cMid).lerp(cHi, THREE.MathUtils.clamp(0.4 + lo*0.7, 0, 1)).lerp(cLo, THREE.MathUtils.clamp(-hi*0.6, 0, 0.5));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.rotateX(Math.PI/2);   // lie flat
  g.computeVertexNormals();
  return g;
}

const PIECES = {
  long:    { name:'긴 감튀',   kcal:6 },
  short:   { name:'짧은 감튀', kcal:4 },
  bent:    { name:'휜 감튀',   kcal:6 },
  tip:     { name:'뾰족 감튀', kcal:5 },
  horn:    { name:'감튀 뿔',   kcal:3 },
  stub:    { name:'짤막 감튀', kcal:3 },
  nugget:  { name:'너겟',      kcal:45 },
  onion:   { name:'어니언링',  kcal:40 },
  ketchup: { name:'케첩',      kcal:3 },
};
const TYPES = Object.keys(PIECES);

// what the side panel shows: one 감튀 tile that drops a random fry
const TILES = [
  { id:'fry', name:'감튀', thumb:'long' },
  { id:'nugget', name:'너겟', thumb:'nugget' },
  { id:'onion', name:'어니언링', thumb:'onion' },
  { id:'ketchup', name:'케첩', thumb:'ketchup' },
];
const isFry = t => t === 'long' || t === 'short' || t === 'bent' || t === 'tip' || t === 'horn' || t === 'stub';

function createPiece(type, seed){
  let geo, mat;
  if (isFry(type)) {
    geo = makeFryGeo(CURVES[type], seed, type === 'tip' || type === 'horn'); mat = fryMat;
    geo.computeBoundingBox(); const mid = geo.boundingBox.getCenter(new THREE.Vector3());
    geo.translate(-mid.x, -mid.y, -mid.z); geo.userData.mid = mid;  // pivot in the middle
  }
  else if (type === 'nugget') { geo = makeNuggetGeo(seed); mat = nugMat; }
  else if (type === 'onion') { geo = makeOnionGeo(seed); mat = nugMat; }
  else { geo = makeKetchupGeo(seed); mat = ketMat; }
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = { type, seed, piece:true, baseMat:mat };
  return m;
}

function addLights(sc, shadows){
  const h = new THREE.HemisphereLight(0xfff3df, 0xcfc3a5, 1.6); sc.add(h);
  const d = new THREE.DirectionalLight(0xfff0d8, 2.4);
  d.position.set(4, 9, 5);
  if (shadows){
    d.castShadow = true;
    d.shadow.mapSize.set(2048, 2048);
    const s = d.shadow.camera; s.left = s.bottom = -6; s.right = s.top = 6; s.near = 1; s.far = 25;
    d.shadow.bias = -0.0004; d.shadow.normalBias = 0.02;
  }
  sc.add(d);
  const f = new THREE.DirectionalLight(0xe8efe0, 0.6); f.position.set(-5, 3, -4); sc.add(f);
  // a second, softer ceiling light from the other side: real rooms have more than one, so pieces get a faint second shadow
  const d2 = new THREE.DirectionalLight(0xfff1dc, shadows ? 0.8 : 0);   // (the tile thumbnails keep their old lighting)
  d2.position.set(-6, 8, 2.5);
  if (shadows){
    d2.castShadow = true; d2.shadow.mapSize.set(1024, 1024); d2.shadow.radius = 4;
    const s2 = d2.shadow.camera; s2.left = s2.bottom = -6; s2.right = s2.top = 6; s2.near = 1; s2.far = 25;
    d2.shadow.bias = -0.0005; d2.shadow.normalBias = 0.03;
  }
  sc.add(d2);
  return { h, d, f, d2 };
}

  const c1 = pos.length/3; { const q = curve.getPointAt(1); pos.push(q.x, q.y, q.z); }
  for (let j = 0; j < M; j++){ idx.push(c0, (j + 1)%M, j); idx.push(c1, S*M + j, S*M + (j + 1)%M); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function redrawBead(sq){
  if (sq.mesh) { scene.remove(sq.mesh); sq.mesh.geometry.dispose(); }
  sq.mesh = new THREE.Mesh(beadGeo(sq.pts, sq.seed), ketMat);
  sq.mesh.castShadow = true; sq.mesh.receiveShadow = true;
  scene.add(sq.mesh);
}
function squirt(hit, sq){
  if (hit.object.userData.type === 'floor' && !inTray(hit.point)) return;
  if (hit.object.userData.type === 'ketchup') return;
  const rest = restFromHit(hit);
  if (!sq.rest) sq.rest = rest;
  const r = KR*(0.94 + Math.random()*0.1);
  sq.pts.push({ p: rest.point.clone().addScaledVector(rest.normal, r*0.62), n: rest.normal.clone(), r });
  sq.last = rest.point.clone(); sq.lastN = rest.normal.clone();
  sq.t = performance.now(); sq.piled = 0;
  redrawBead(sq);
  if (sq.pts.length === 1) squish();   // one soft squelch when the squeeze starts, then quiet
}
// holding still keeps squeezing: the bead rises into a horn, and every horn comes out a little different
function hornStyle(){
  const R = Math.random;
  return {
    K: 12 + Math.floor(R()*11),               // how tall it gets
    step: KR*(0.42 + R()*0.2),                 // rise per step
    base: 1.45 + R()*0.5,                     // how fat the bottom is
    lean: (R() < 0.3 ? 0 : R())*0.9,           // some stand straight, some lean over
    leanA: R()*Math.PI*2,
    sway: KR*(0.08 + R()*0.3), swayF: 0.25 + R()*0.35, swayP: R()*6,   // a soft wobble, not a spiral
    curl: R() < 0.4 ? 0.5 + R()*0.5 : 0,       // sometimes the tip flops over
    tip: 0.3 + R()*0.15,
  };
}
function pileUp(sq){
  if (!sq.last) return;
  const st = sq.horn || (sq.horn = hornStyle());
  const due = Math.floor((performance.now() - sq.t - 220)/70) + 1;
  let grew = false;
  while ((sq.piled || 0) < Math.min(due, st.K)){
    const k = ++sq.piled, u = k/st.K, n0 = sq.lastN, U = _perp(n0), W = n0.clone().cross(U);
    const dir = U.clone().multiplyScalar(Math.cos(st.leanA)).addScaledVector(W, Math.sin(st.leanA));
    const side = dir.clone().cross(n0);
    const H = st.K*st.step;
    let up = KR*0.4 + k*st.step, out = st.lean*H*0.35*u*u;
    if (st.curl && u > 0.6){ const c = (u - 0.6)/0.4; out += st.curl*KR*1.8*c*c; up -= st.curl*KR*0.8*c*c*c; }
    const wob = st.sway*Math.sin(k*st.swayF + st.swayP)*(1 - u);
    const p = sq.last.clone().addScaledVector(n0, up).addScaledVector(dir, out).addScaledVector(side, wob);
    sq.pts.push({ p, n: n0.clone(), r: KR*Math.max(st.tip, st.base*Math.pow(1 - u, 0.85)) });
    grew = true;
  }
  if (grew) redrawBead(sq);
}
function finishBead(sq){
  if (sq.mesh) { scene.remove(sq.mesh); sq.mesh.geometry.dispose(); sq.mesh = null; }
  if (!sq.pts.length) return null;
  const O = sq.pts[0].p.clone(), geo = beadGeo(sq.pts, sq.seed);
  geo.translate(-O.x, -O.y, -O.z);
  let len = 0; for (let i = 1; i < sq.pts.length; i++) len += sq.pts[i].p.distanceTo(sq.pts[i - 1].p);
  const m = strokeMesh(geo, { kcal: Math.max(3, Math.round(3 + len*5)), rest: sq.rest });
  m.position.copy(O);
  build.add(m);
  return m;
}

/* pointer: drag a piece to move it, drag the rings to rotate, drag elsewhere to look around */
const cv = renderer.domElement;
let down = null;
cv.addEventListener('pointerleave', () => { if (!down) setHover(null); });
cv.addEventListener('pointerdown', e => {
  audio(); setHover(null);
  down = { x:e.clientX, y:e.clientY, t:performance.now(), b:e.button, moved:false, drag:null, tc: tc.dragging };
  if (busy || tc.dragging) return;
  const hit = pick(e.clientX, e.clientY);
  if (state.squeeze && hit && e.button === 0) {
    controls.enabled = false;
    down.sq = { pts: [], last: null, sx: e.clientX, sy: e.clientY, seed: Math.random()*100 };
    squirt(hit, down.sq);
    const sq = down.sq; sq.timer = setInterval(() => pileUp(sq), 80);
    return;
  }
  if (!hit || !hit.object.userData.piece) return;
  if (e.button === 2) return;
  stopFalls();
  const m = hit.object;
  if (m !== selected) select(m);
  controls.enabled = false;
  if (state.mode === 'rotate' || e.shiftKey || e.altKey) {
    down.rot = beginRot(); down.lx = e.clientX; down.ly = e.clientY;
    cv.style.cursor = 'move';
    return;
  }
  if (state.mode === 'scale') {
    down.scl = { snap: snapshot(), s0: m.userData.size || 1, carry: beginCarry() };
    cv.style.cursor = 'ns-resize';
    return;
  }
  const o = m.position.clone().project(camera);
  const r = cv.getBoundingClientRect();
  const ox = (o.x + 1)/2*r.width + r.left, oy = (1 - o.y)/2*r.height + r.top;
  down.drag = { m, dx: ox - e.clientX, dy: oy - e.clientY, snap: snapshot(), lifted: false, carry: beginCarry(), ex: selGroup() };
  cv.style.cursor = 'grabbing';
});

cv.addEventListener('pointermove', e => {
  if (!down) {
    if (state.squeeze) { setHover(null); cv.style.cursor = KCUR; return; }
    if (e.pointerType === 'mouse') {
      if (tc.axis) { setHover(null); cv.style.cursor = 'pointer'; return; }
      const h = pick(e.clientX, e.clientY);
      setHover(!busy && h && h.object.userData.piece ? h.object : null); cv.style.cursor = h && h.object.userData.piece ? (state.mode === 'scale' && selected ? 'ns-resize' : state.mode === 'rotate' && selected || e.shiftKey || e.altKey ? 'move' : 'grab') : 'default';
    }
    return;
  }
  if (down.tc) return;
  if (down.sq) {
    down.moved = true;
    const sq = down.sq;
    if (Math.hypot(e.clientX - sq.sx, e.clientY - sq.sy) < 6) return;   // tiny wobble while holding: keep piling
    const hit = pick(e.clientX, e.clientY);
    if (hit && (!sq.last || hit.point.distanceTo(sq.last) > 0.035)) { squirt(hit, sq); sq.sx = e.clientX; sq.sy = e.clientY; }
    return;
  }
  if (down.scl) {
    if (!down.moved && Math.abs(e.clientY - down.y) > 3) { down.moved = true; $('selActs').classList.add('drag'); }
    if (down.moved) {
      const sz = Math.round(THREE.MathUtils.clamp(down.scl.s0*Math.exp((down.y - e.clientY)*0.006), SMIN, SMAX)*100)/100;
      if (sz !== selected.userData.size) { setSize(sz); applyCarry(down.scl.carry); }
    }
    return;
  }
  if (down.rot) {
    if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 3) { down.moved = true; tc.getHelper().visible = false; $('selActs').classList.add('drag'); }
    if (down.moved) { stepRot(down.rot, e.clientX - down.lx, e.clientY - down.ly, !e.ctrlKey); down.lx = e.clientX; down.ly = e.clientY; }
    return;
  }
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down.moved = true; if (down.drag) { tc.getHelper().visible = false; $('selActs').classList.add('drag'); } }
  const d = down.drag;
  if (!d || !down.moved) return;
  const hit = pick(e.clientX + d.dx, e.clientY + d.dy, d.ex);
  if (!hit) return;
  if (hit.object.userData.type === 'floor' && !inTray(hit.point)) return;
  const rest = restFromHit(hit);
  d.m.userData.rest = rest;
  d.m.position.copy(seatPos(d.m, rest));
  if (!d.lifted) { d.lifted = true; blip(500, 0.05, 0.03); }
  const k2 = rest.type + (rest.obj ? rest.obj.id : '');
  if (d.lastType !== k2) { if (d.lastType) blip(rest.type === 'floor' ? 380 : 620, 0.05, 0.035); d.lastType = k2; }
  syncTwin(); applyCarry(d.carry);
});

function endPointer(e, cancel){
  const d = down; down = null;
  if (!tc.dragging) controls.enabled = true;
  tc.getHelper().visible = !!tc.object;
  $('selActs').classList.remove('drag');
  cv.style.cursor = state.squeeze ? KCUR : 'default';
  if (!d || busy || d.tc) return;
  if (d.sq) { clearInterval(d.sq.timer); const m = finishBead(d.sq); if (m) { history.push({ added: [m], removed:[] }); changed(); } return; }
  if (d.rot) { endRot(d.rot); if (d.rot.moved) thud(); return; }
  if (d.scl) { if (d.moved) { const h = { added:[], removed:[], transforms: d.scl.snap }; history.push(h); settle(h, selGroup()); thud(); changed(); } return; }
  if (d.drag && d.moved && d.drag.lifted) {
    const h = { added:[], removed:[], transforms: d.drag.snap }; history.push(h); settle(h, selGroup());
    thud(); changed(); return;
  }
  if (cancel || d.moved || performance.now() - d.t > 700) return;
  const hit = pick(e.clientX, e.clientY);
  if (d.b === 2) { if (hit && hit.object.userData.piece) { select(hit.object); act('del'); } return; }
  if (!hit || !hit.object.userData.piece) select(null);
}
cv.addEventListener('pointerup', e => endPointer(e, false));
cv.addEventListener('pointercancel', e => endPointer(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());

/* resize */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  const pw = $('panel').offsetWidth;
  camera.setViewOffset(w, h, pw*0.5, -h*0.03, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe($('panel'));
resize();
{ const k = 1.0/Math.min(1, camera.aspect*1.5); camera.position.multiplyScalar(k); }

/* loop */
function tick(now){
  stepLook(now); stepFalls(now); stepFlick(now); stepFlying(now);
  for (let i = anims.length - 1; i >= 0; i--){
    const a = anims[i]; const t = (now - a.t0)/a.dur;
    if (a.kind === 'drop'){
      if (now < a.t0) continue;
      a.m.visible = true;
      if (down && down.drag && down.drag.lifted && selGroup().includes(a.m)) { anims.splice(i, 1); continue; }
      const dt = a.last ? Math.min(0.05, (now - a.last)/1000) : 0; a.last = now;
      a.v -= 32*dt; a.m.position.y += a.v*dt;
      if (a.m.position.y <= a.yRest){
        a.m.position.y = a.yRest;
        if (a.bounces === 0) thud();
        a.bounces++; a.v = -a.v*0.32;
        if (Math.abs(a.v) < 1.2 || a.bounces > 2) anims.splice(i, 1);
      }
      continue;
    }
    if (t < 0) continue;
    if (a.kind === 'in'){
      const sz = a.m.userData.size || 1;
      a.m.scale.setScalar(Math.max(0.0001, sz*backOut(Math.min(1, t))));
      if (t >= 1) { a.m.scale.setScalar(sz); anims.splice(i, 1); }
    } else {
      if (a.sound) { a.sound = false; crunch(); }
      const k = Math.min(1, t);
      const sz = a.m.userData.size || 1;
      a.m.scale.setScalar(Math.max(0.0001, sz*(1 - k) * (1 + 0.25*Math.sin(k*Math.PI))));
      if (t >= 1) { build.remove(a.m); a.m.scale.setScalar(sz); anims.splice(i, 1); }
    }
  }
  if (camTween){
    const t = Math.min(1, (now - camTween.t0)/700), e = 1 - Math.pow(1-t, 3);
    controls.target.lerpVectors(camTween.from, camTween.to, e);
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, camTween.d0 + (camTween.d1 - camTween.d0)*e);
    if (t >= 1) camTween = null;
  }
  controls.update();
  const target = totalKcal();
  kcalShown += (target - kcalShown)*0.18;
  if (Math.abs(target - kcalShown) < 1) kcalShown = target;
  $('kcalNum').textContent = Math.round(kcalShown).toLocaleString();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
syncUI(); changed();
requestAnimationFrame(tick);

// test hook
window.__game = { redo, useTile, setSqueeze, loadPreset, state, build, addPiece, pick, camera, controls, tc, setMode, select, act, settle, history, undo, falls };
