<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>감튀블록</title>
<script>try{if(localStorage.getItem('gamtwi-night')!=='0')document.documentElement.dataset.theme='night'}catch(e){document.documentElement.dataset.theme='night'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf7ec; --ink:#3c504a; --muted:#8b968e; --green:#47625a; --green-d:#33473f;
    --panel:#edf0df; --card:#fbf8f0; --line:#e5e0cd; --tile:#f3eee2; --surface:#fffdf8; --hover:#fff;
    --shadow:rgba(60,80,74,.14);
  }
  :root[data-theme="night"]{
    --bg:#11151c; --ink:#ece6d6; --muted:#8d95a0; --green:#5c7f72; --green-d:#3e5a50;
    --panel:#1a2029; --card:#1b212a; --line:#2c3440; --tile:#242c37; --surface:#1f2630; --hover:#2c3542;
    --shadow:rgba(0,0,0,.45);
  }
  body,.pill,.panel .card,.tile,.selbar,#squeezeTip,.examples button,.chip{transition:background-color .6s, color .6s, border-color .6s}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

  .top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 22px 0;pointer-events:none;z-index:5}
  .top > *{pointer-events:auto}
  .brand{font-weight:500;font-size:17px}
  .top-actions{display:flex;gap:8px}
  .pill{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;height:36px;padding:0 12px;
    font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
  .pill:active{transform:scale(.96)}
  .pill svg{width:16px;height:16px}
  .pill[disabled]{opacity:.4;pointer-events:none}
  .pill:not(#gravBtn){padding:0 10px}
  .pill .lbl{font-size:13px;font-weight:600;white-space:nowrap}
  .brand{white-space:nowrap}
  @media (max-width:520px){ #clearBtn .lbl{display:none} #gravBtn{padding:0 8px} .top-actions{gap:4px !important} .pill:not(#gravBtn){padding:0 8px} .brand{font-size:15px} }
  .more-wrap{position:relative}
  #moreBtn{display:inline-flex;justify-content:center;width:38px;padding:0}
  #moreBtn svg{width:18px;height:18px}
  .more-menu{display:none;position:absolute;right:0;top:calc(100% + 10px);width:272px;max-width:calc(100vw - 28px);
    padding:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 12px 36px var(--shadow);z-index:10}
  .more-wrap.open .more-menu{display:block}
  .top:has(.more-wrap.open){z-index:40}
  .more-wrap.open #moreBtn{background:var(--line)}
  .settings-heading{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .settings-heading h2{font-size:15px;font-weight:700;margin:0}
  #settingsClose{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted)}
  #settingsClose svg{width:16px;height:16px}
  .more-menu .pill{border:0;background:none;width:100%;height:52px;padding:0 10px !important;justify-content:flex-start;gap:12px;border-radius:10px;color:var(--ink)}
  .more-menu .pill:hover,#settingsClose:hover{background:var(--tile)}
  .more-menu .pill:active{transform:none;background:var(--line)}
  .more-menu .pill svg{opacity:1;width:18px;height:18px;flex:0 0 auto}
  .more-menu .mlbl,.more-menu .lbl{display:inline;flex:1;text-align:left;font-size:14px;font-weight:600}
  .setting-value{font-size:12px;color:var(--muted)}
  .more-menu .sw{display:block;margin-left:0}
  .more-menu .pill:not(.on) .sw{background:var(--muted);opacity:.55}
  .more-menu .pill:not(.on) .sw i{left:2px}
  button:focus-visible{outline:2px solid var(--green);outline-offset:3px}
  .pill.off{color:var(--muted)}
  .pill.off svg{opacity:.45}
  .pill .sw{position:relative;width:28px;height:16px;border-radius:8px;background:var(--green);margin-left:2px;flex:0 0 auto;transition:background-color .2s}
  .pill .sw i{position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
  .pill.off .sw{background:var(--muted);opacity:.55}
  .pill.off .sw i{left:2px}

  #hint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);
    font-size:13.5px;color:var(--muted);text-align:center;line-height:1.6;transition:opacity .5s;z-index:4;
    white-space:nowrap;pointer-events:none}
  #hint b{color:var(--ink);font-weight:700}
  .keys{display:block;font-size:12px;opacity:.85}
  @media (pointer:coarse){.keys{display:none}}

  #squeezeTip{position:fixed;left:calc(50% - var(--rail)/2 - 12px);bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%, 12px);
    z-index:8;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;font-size:13.5px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .15s, transform .2s;white-space:nowrap}
  #squeezeTip.show{opacity:1;pointer-events:auto;transform:translate(-50%, 0)}
  #squeezeTip b{color:#b8231b}
  #squeezeTip button{height:32px;padding:0 12px;border-radius:9px;background:#c4392b;color:#fff;font-weight:700;font-size:13px}
  body:has(#squeezeTip.show) .kcal{opacity:0}
  .tile.on{border-color:#c4392b;background:var(--hover)}
  .kcal{position:fixed;right:24px;z-index:4;font-family:Outfit,sans-serif;font-weight:700;font-size:48px;
    letter-spacing:-.5px;line-height:1;pointer-events:none;bottom:0}
  .kcal small{font-size:30px;margin-left:2px}
  .kcal{transition:opacity .2s}

  .panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:32px 32px 0 0;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:6}
  .card{max-width:560px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:28px;
    padding:16px 16px 18px;box-shadow:0 10px 30px rgba(60,80,74,.06)}
  .pieces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tile{background:var(--tile);border-radius:16px;padding:6px 2px 8px;display:flex;flex-direction:column;
    align-items:center;gap:2px;border:2px solid transparent;transition:transform .15s, background .15s, border-color .15s;position:relative}
  .tile img{width:58px;height:58px;display:block;pointer-events:none}
  .tile span{font-size:11px;font-weight:500;white-space:nowrap}
  .tile .num{position:absolute;top:5px;left:8px;font-size:10px;color:var(--muted);font-family:Outfit}
  @media (pointer:coarse){.tile .num{display:none}}
  .tile:focus{outline:none}
  .tile:hover{transform:translateY(-2px);background:var(--hover)}
  .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .seg{display:flex;align-items:center;background:var(--tile);border-radius:12px;height:40px;flex:1 1 auto;min-width:150px}
  .seg button{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
  .seg button:active{background:#e8e2d2}
  .seg svg{width:18px;height:18px}
  .seg span{flex:1;text-align:center;font-size:13.5px;font-weight:500;white-space:nowrap}
  .chip{background:var(--tile);border-radius:12px;height:40px;padding:0 14px;font-size:13.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;border:2px solid transparent;transition:all .15s;flex:0 0 auto}
  .chip svg{width:17px;height:17px}
  .chip.on{background:var(--green);color:#fff}
  .chip.danger.on{background:#c4574a}
  .chip:active{transform:scale(.96)}
  .examples{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--muted)}
  .examples .lbl{margin-right:4px}
  .examples button{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);font-size:13px;font-weight:500;background:var(--surface)}
  .examples button:active{transform:scale(.96)}
  .primary{display:flex;width:100%;height:56px;margin-top:14px;align-items:center;justify-content:center;gap:8px;
    background:var(--green);color:#fff;border-radius:18px;font-size:17px;font-weight:700;
    box-shadow:0 6px 0 var(--green-d);transition:transform .08s, box-shadow .08s;margin-bottom:6px}
  .primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
  .primary[disabled]{opacity:.45;pointer-events:none}
  .primary svg{width:20px;height:20px}

  .tiphint{flex:1 1 auto;font-size:12.5px;line-height:1.45;color:var(--muted);align-self:center;min-width:0}
  .tiphint b{color:var(--ink);font-weight:700}
  .tools{align-items:center}
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .15s;will-change:transform}
  .tile.tap{animation:tap .32s}
  @keyframes tap{30%{transform:translateY(3px) scale(.94)}70%{transform:translateY(-3px)}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .45s}
  #flash.on{opacity:.85;transition:none}
  #toast{position:fixed;left:calc(50% - var(--rail)/2 - 12px);top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:31;
    background:var(--green);color:#fff;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(253,247,236,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.show{opacity:1;pointer-events:auto}
  .modal .sheet{width:100%;background:var(--panel);border-radius:32px 32px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
  .modal.show .sheet{transform:none}
  .modal .card{text-align:center;padding:30px 24px 22px}
  .modal h2{margin:0 0 14px;font-size:26px;font-weight:800;letter-spacing:-.3px}
  .modal p{margin:0 0 26px;color:var(--muted);font-size:14.5px}
  .modal .rec{display:flex;justify-content:center;gap:22px;font-size:15px;margin-bottom:20px}
  .modal .rec b{font-family:Outfit;font-size:18px}
  .bigcount{font-family:Outfit;font-weight:700;font-size:56px;line-height:1;margin:6px 0 10px}
  .bigcount small{font-size:30px}

  @media (max-width:520px){
    .top{padding-left:16px;padding-right:12px}
    .pill .tx{display:none}
    .pill{padding:0 10px}
    .kcal{font-size:40px;right:18px}
    .kcal small{font-size:24px}
    .tile img{width:48px;height:48px}
    .tile span{font-size:11px}
    .pieces{gap:6px}
    .card{padding:12px 12px 14px;border-radius:24px}
    .panel{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
    .chip{padding:0 11px}
    .chip .tx2{display:none}
    .primary{height:52px}
  }
  /* ---- side rail layout ---- */
  :root{--rail:112px}
  .panel{left:auto;right:0;top:0;bottom:0;width:calc(var(--rail) + 24px);border-radius:0;
    padding:calc(66px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) 12px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:10px;background:transparent;pointer-events:none}
  .panel .sect{text-align:center;margin:2px 0 0;font-size:11px;color:var(--muted)}
  .panel .card{pointer-events:auto;box-shadow:0 12px 32px rgba(60,80,74,.10)}
  .panel .card{width:100%;max-width:none;margin:0;padding:10px 8px;border-radius:22px;display:flex;flex-direction:column;gap:8px;
    flex:0 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}
  .panel .card::-webkit-scrollbar{display:none}
  .pieces{grid-template-columns:1fr;gap:6px}
  .tile{padding:6px 2px 7px;border-radius:14px}
  .tile img{width:54px;height:54px}
  .rule{height:1px;background:var(--line);margin:2px 4px}
  .panel .chip{justify-content:center;height:38px;padding:0;width:100%;font-size:13px}
  .panel .examples{flex-direction:column;align-items:stretch;gap:5px;margin:0;flex-shrink:0;
    max-height:var(--preset-max-height,none);overflow-y:auto;scrollbar-width:none}
  .panel .examples::-webkit-scrollbar{display:none}
  .panel .examples > *{flex-shrink:0}
  .panel .examples .lbl{text-align:center;margin:2px 0 0;font-size:11px}
  .panel .examples button{padding:6px 0;font-size:11px}
  .panel .primary{pointer-events:auto;flex:0 0 auto;height:56px;margin:0;border-radius:18px;font-size:15px;flex-direction:column;gap:0;line-height:1.1;box-shadow:0 4px 0 var(--green-d), 0 12px 28px rgba(60,80,74,.18)}
  .panel .primary svg{width:18px;height:18px}
  .kcal{right:auto;left:22px;bottom:calc(18px + env(safe-area-inset-bottom)) !important}
  #hint{left:calc(50% - var(--rail)/2 - 12px)}
  @media (max-width:520px){
    :root{--rail:76px}
    .panel{padding-left:8px;padding-right:8px;width:calc(var(--rail) + 16px)}
    .panel .card{padding:8px 5px;border-radius:18px;gap:6px}
    .tile{padding:5px 0 6px;border-radius:12px}
    .tile img{width:42px;height:42px}
    .tile span{font-size:10.5px}
    .panel .chip span{display:none}
    .panel .examples button{font-size:11px}
    .panel .primary{height:46px;font-size:13px}
    .kcal{font-size:36px;left:16px}
    .kcal small{font-size:22px}
    #hint{font-size:12.5px}
  }
  .tabs{display:none}
  /* ---- phone, landscape: compact two-column rail ---- */
  @media (max-height:520px) and (orientation:landscape){
    :root{--rail:168px}
    .top{padding-top:calc(10px + env(safe-area-inset-top))}
    .panel .sect,.panel .examples .lbl{display:none}
    .panel{padding:calc(54px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)) 10px;width:calc(var(--rail) + 20px);gap:8px}
    .panel .card{padding:7px 6px;gap:6px;border-radius:18px}
    .pieces{grid-template-columns:1fr 1fr;gap:5px}
    .tile{padding:4px 0 5px;border-radius:12px}
    .tile img{width:34px;height:34px}
    .tile span{font-size:10.5px}
    .panel .examples{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .panel .examples .lbl{grid-column:1 / -1}
    .panel .examples button{font-size:10.5px;padding:0 2px;height:26px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .panel .primary{height:40px;flex-direction:row;gap:6px;font-size:14px}
    .kcal{font-size:30px;left:16px}
    .kcal small{font-size:18px}
  }
  /* ---- phone, portrait: everything moves into a dock along the bottom, with 재료 / 예시 tabs ---- */
  @media (max-width:640px) and (orientation:portrait){
    :root{--rail:0px}
    .panel{left:0;right:0;top:auto;bottom:0;width:auto;padding:0 10px calc(10px + env(safe-area-inset-bottom));
      flex-direction:row;align-items:stretch;justify-content:stretch;gap:8px}
    .panel .card{flex:1 1 auto;padding:6px 8px 8px;gap:6px;border-radius:20px;overflow:visible}
    .tabs{display:flex;gap:4px;background:var(--tile);border-radius:11px;padding:3px}
    .tabs button{flex:1;height:28px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
    .tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
    .panel .sect,.panel .rule,.panel .examples .lbl{display:none}
    .pieces{grid-template-columns:repeat(4,1fr);gap:6px}
    .tile{padding:4px 0 5px;border-radius:12px}
    .tile img{width:40px;height:40px}
    .tile span{font-size:11px}
    .panel .examples{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:center}
    .panel .examples button{font-size:11px;padding:0;height:31px}
    .panel .card[data-tab="pieces"] .examples{display:none}
    .panel .card[data-tab="ex"] .pieces{display:none}
    .panel .card[data-tab="ex"] .examples{min-height:68px}
    .panel .primary{width:66px;height:auto;border-radius:18px;font-size:13px;box-shadow:0 4px 0 var(--green-d)}
    .kcal{left:16px;bottom:calc(var(--dock, 140px) + 10px) !important;font-size:32px}
    .kcal small{font-size:19px}
    .selbar,.selbar.show,#squeezeTip{bottom:calc(var(--dock, 140px) + 10px) !important}
    #squeezeTip{left:50%}
    #toast{left:50%}
  }
  .selbar{position:fixed;left:calc(50% - var(--rail)/2 - 12px);bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;
    display:flex;align-items:center;gap:2px;padding:4px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);
    opacity:0;pointer-events:none;transform:translate(-50%, 12px);transition:opacity .15s, transform .2s}
  .selbar.show{opacity:1;pointer-events:auto;transform:translate(-50%, 0)}
  .selbar.show.drag{opacity:.35;pointer-events:none}
  .selbar button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
  .selbar button:hover{background:var(--tile)}
  .selbar button:active{transform:scale(.92)}
  .selbar svg{width:19px;height:19px}
  .selbar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
  .selbar .txt{width:auto;padding:0 10px;display:flex;gap:5px;font-size:13px;font-weight:700;white-space:nowrap}
  .selbar .on{background:var(--green);color:#fff}
  .selbar .mode{margin-right:1px}
  .selbar .on:hover{background:var(--green-d)}
  .selbar .danger{color:#b54b3f}
  .selbar .danger:hover{background:#f7e3df}
  .selbar .scrub{touch-action:none;cursor:ew-resize}
  .selbar .scrub.drag{background:var(--green);color:#fff}
  .selbar .close{background:none;color:var(--ink);opacity:.6}
  .selbar .close:hover{background:none;opacity:1}
  @media (max-width:760px){
    .selbar .txt span{display:none}
    .selbar .txt{padding:0;width:38px;justify-content:center}
  }
  @media (max-width:520px){
    .selbar,.selbar.show{left:8px;right:calc(var(--rail) + 22px);transform:none;gap:0;padding:3px}
    .selbar{transform:translateY(12px)}
    body:has(.selbar.show) .kcal{opacity:0}
    .selbar button,.selbar .txt{flex:1 1 0;width:auto;min-width:0;height:38px}
    .selbar .sep{margin:0 1px}
    .selbar .ok{flex:0 0 auto;padding:0 8px}
  }
  /* Keep docked toolbar rules after the shared centered toolbar styles. */
  @media (max-width:640px) and (orientation:portrait){
    .selbar,.selbar.show{left:max(10px, env(safe-area-inset-left));right:max(10px, env(safe-area-inset-right));gap:0;padding:3px}
    .selbar{transform:translateY(12px)}
    .selbar.show{transform:translateY(0)}
    .selbar button,.selbar .txt{flex:1 1 0;width:auto;min-width:0;height:38px;justify-content:center}
    .selbar .sep{flex:0 0 1px;margin:0 3px}
    body:has(.selbar.show) .kcal{opacity:0}
  }
  #loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;

function makeFryGeo(curve, seed, taper = false){

      col.push(c.r, c.g, c.b);

    const a = i*P+j, b = i*P+(j+1)%P, cc = (i+1)*P+j, d = (i+1)*P+(j+1)%P;

function makeNuggetGeo(seed){
  const rnd = mulberry32(seed);

  const SHAPES = [
    [[0,0.05,0.62],[0,-0.42,0.42],[0.38,-0.38,0.22],[-0.38,-0.38,0.22]],              // bell
    [[-0.12,0.12,0.5],[0.3,-0.3,0.42],[0.62,-0.4,0.3]],                                 // boot
    [[0,0,0.6],[0.18,0.12,0.45]],                                                       // ball
    'bone',
  ];
  const pickN = Math.floor(rnd()*(SHAPES.length + 1));   // bone comes up a little more often

  let cx = 0, cy = 0, wsum = 0;
  for (const [x,y,r] of discs) { cx += x*r*r; cy += y*r*r; wsum += r*r; }

  const socks = [{ p:new THREE.Vector3(0, thick, 0), n:new THREE.Vector3(0,1,0) }, { p:new THREE.Vector3(0, -thick, 0), n:new THREE.Vector3(0,-1,0) }];

    const a = i/8*Math.PI*2, r = Rat(a + rot)*scale, r2 = Rat(a + rot + 0.05)*scale, r1 = Rat(a + rot - 0.05)*scale;

const GLSL_NOISE = `

function patchSurface(mat, kind){

  // ---------- baked contact shadows on the floor ----------

  // and lay it on the floor as a multiply layer: sharp and dark right under legs and bases, wide and soft under table tops and sofas,
  // nudged slightly away from the main light so it agrees with the tray's own shadows.
  function bakeFloorShadow(){
    const N = 1024, top = FY + 16;
    const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.01, 16 - 0.1);
    cam.position.set(0, top, 0); cam.up.set(0, 0, -1); cam.lookAt(0, FY, 0); cam.updateMatrixWorld();
    const rt = new THREE.WebGLRenderTarget(N, N);
    const black = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
    const prev = { bg: scene.background, fog: scene.fog, om: scene.overrideMaterial, rt: renderer.getRenderTarget(), sh: renderer.shadowMap.enabled, tm: renderer.toneMapping };
    scene.background = new THREE.Color(0xffffff); scene.fog = null; scene.overrideMaterial = black; renderer.shadowMap.enabled = false; renderer.toneMapping = THREE.NoToneMapping;
    const hidden = []; restaurant.traverse(o => { if (o.isMesh && o.material && o.material.transparent && o.visible){ o.visible = false; hidden.push(o); } });
    const grab = (near) => {
      cam.near = near; cam.updateProjectionMatrix();
      renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, cam);
      const px = new Uint8Array(N*N*4); renderer.readRenderTargetPixels(rt, 0, 0, N, N, px);
      const [c, x] = cv(N, N), img = x.createImageData(N, N);
      for (let r = 0; r < N; r++) img.data.set(px.subarray((N - 1 - r)*N*4, (N - r)*N*4), r*N*4);
      x.putImageData(img, 0, 0); return c;
    };
    const low = grab(16 - 3.2);    // legs, feet, bases, sofa plinths: the lowest 3 units
    const all = grab(0.01);        // everything up to table-top height
    hidden.forEach(o => o.visible = true);
    scene.background = prev.bg; scene.fog = prev.fog; scene.overrideMaterial = prev.om; renderer.setRenderTarget(prev.rt);
    renderer.shadowMap.enabled = prev.sh; renderer.toneMapping = prev.tm; renderer.shadowMap.needsUpdate = true;
    rt.dispose(); black.dispose();
    // compose: white base, multiply in the blurred silhouettes
    const [out, o] = cv(N, N);
    o.fillStyle = '#fff'; o.fillRect(0, 0, N, N);
    o.globalCompositeOperation = 'multiply';
    const layer = (src, blur, alpha, dx = 0, dy = 0) => { o.filter = `blur(${blur}px)`; o.globalAlpha = alpha; o.drawImage(src, dx, dy); };
    layer(all, 20, 0.55, -4, -5);   // wide soft occlusion (1px is about 0.15 units)
    layer(all, 7, 0.32, -2, -2);
    layer(low, 2, 0.85);            // tight contact right at the feet
    o.filter = 'none'; o.globalAlpha = 1;
    const t = new THREE.CanvasTexture(out); t.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.MeshBasicMaterial({ map: t, transparent: true, blending: THREE.MultiplyBlending, premultipliedAlpha: true, depthWrite: false, fog: false,
      polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(2*R, 2*R).rotateX(-Math.PI/2), m);
    p.position.y = FY + 0.04; p.renderOrder = 1; p.raycast = () => {}; restaurant.add(p);
  }

  r.yaw += dx*0.012; r.pitch += dy*0.012;
  const ty = snap ? Math.round(r.yaw/SNAP)*SNAP : r.yaw, tp = snap ? Math.round(r.pitch/SNAP)*SNAP : r.pitch;
  if (ty !== r.ay){ rotateSel(new THREE.Quaternion().setFromAxisAngle(Y, ty - r.ay)); r.ay = ty; if (snap) blip(720, 0.03, 0.02); }
  if (tp !== r.ap){ rotateSel(new THREE.Quaternion().setFromAxisAngle(camRight(), tp - r.ap)); r.ap = tp; if (snap) blip(720, 0.03, 0.02); }
  r.moved = true;
}
function endRot(r){
  if (r && r.moved && (r.ay || r.ap)) { const h = { added:[], removed:[], transforms: r.snap }; history.push(h); settle(h, selGroup()); changed(); }
}

let tcSnap = null, tcCarry = null;
tc.addEventListener('mouseDown', () => { stopFalls(); tcSnap = snapshot(); tcCarry = beginCarry(); blip(640, 0.04, 0.03); });

  }

  if (tc.mode === 'translate' && selected) { selected.userData.rest = null; const t = selected.userData.twin; if (t && t.parent === build) t.userData.rest = null; }
  const h = { added:[], removed:[], transforms: tcSnap }; history.push(h); tcSnap = null; settle(h, selGroup());

/* drop a new piece onto the plate */
function freeSpot(){
  const pts = build.children.map(m => m.position);
  let best = null, bestD = -1;
  for (let i = 0; i < 40; i++){
    const k = Math.min(1, camera.aspect*0.9);
    const x0 = (Math.random()*2 - 1)*(TW/2 - 0.9)*k, z0 = (Math.random()*2 - 1)*(TD/2 - 0.9);
    const x = x0*Math.cos(trayAngle) + z0*Math.sin(trayAngle), z = -x0*Math.sin(trayAngle) + z0*Math.cos(trayAngle);   // in the turned tray
    let d = Infinity; for (const p of pts) d = Math.min(d, Math.hypot(p.x - x, p.z - z));
    d -= Math.hypot(x, z)*0.25;  // prefer near the middle
    if (d > bestD) { bestD = d; best = [x, z]; }
  }
  return best || [0.8, 0.8];
}
function restingQuat(type){
  const yaw = Math.random()*Math.PI*2;
  if (isFry(type)) return new THREE.Quaternion().setFromAxisAngle(Y, yaw).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), -Math.PI/2));
  return new THREE.Quaternion().setFromAxisAngle(Y, yaw);
}
function addPiece(type){
  if (busy) return;
  const [x, z] = freeSpot();
  const m = createPiece(type, newSeed());
  m.quaternion.copy(restingQuat(type));
  m.position.set(x, 0, z);
  m.userData.rest = { point: new THREE.Vector3(m.position.x, 0, m.position.z), normal: Y.clone(), type:'floor' };
  m.position.copy(seatPos(m, m.userData.rest));
  const added = [m];
  dropIn(m);
  history.push({ added, removed:[] });
  select(m);
  blip(900, 0.05, 0.03);
  changed();
}
function duplicate(){
  const g = selGroup(); if (!g.length) return;
  const added = [], copies = new Map();
  for (const m of g){
    const c = m.userData.stroke ? strokeMesh(m.geometry, { kcal: m.userData.kcal }) : createPiece(m.userData.type, newSeed());
    c.quaternion.copy(m.quaternion); c.userData.size = m.userData.size || 1;
    const off = new THREE.Vector3(m.position.x >= 0 ? 0.45 : -0.45, 0, 0.45);
    if (g.length === 1) off.x = 0.45;
    c.position.copy(m.position).add(off);
    c.userData.rest = m.userData.rest ? { ...m.userData.rest, point: m.userData.rest.point.clone().add(off) } : null;
    copies.set(m, c); added.push(c); spawn(c);
  }
  if (g.length === 2){ const [a, b] = added; a.userData.twin = b; b.userData.twin = a; }
  const h = { added, removed:[] }; history.push(h); settle(h);
  select(copies.get(selected));
  blip(760, 0.07, 0.05);
  changed();
}

const redoStack = [];
const _push = Array.prototype.push;
history.push = function(...a){ redoStack.length = 0; return _push.apply(this, a); };   // any new action clears the redo trail
function redo(){
  if (busy) return;
  const h = redoStack.pop(); if (!h) return;
  stopFalls(); select(null);
  if (h.turn) { _push.call(history, h); startTurn(h.turn); changed(); return; }
  h.removed.forEach(m => { if (m.parent) m.parent.remove(m); });
  h.added.forEach(m => { m.material = m.userData.baseMat; m.visible = true; spawn(m); });
  (h.redoT || []).forEach(t => { t.m.quaternion.copy(t.q); t.m.position.copy(t.p); t.m.userData.rest = t.r; t.m.userData.size = t.s; t.m.scale.setScalar(t.s); });
  _push.call(history, h);
  blip(460, 0.08, 0.05, 'triangle');
  changed();
}
function undo(){
  if (busy) return;
  stopFalls();
  const h = history.pop(); if (!h) return;
  select(null);
  if (h.turn) { redoStack.push(h); startTurn(-h.turn); changed(); return; }
  h.redoT = (h.transforms || []).map(t => ({ m: t.m, q: t.m.quaternion.clone(), p: t.m.position.clone(), r: t.m.userData.rest, s: t.m.userData.size || 1 }));
  redoStack.push(h);
  h.added.forEach(m => build.remove(m));
  h.removed.forEach(m => { m.material = m.userData.baseMat; m.visible = true; spawn(m); });
  (h.transforms || []).forEach(t => { t.m.quaternion.copy(t.q); t.m.position.copy(t.p); t.m.userData.rest = t.r; t.m.userData.size = t.s; t.m.scale.setScalar(t.s); });
  blip(380, 0.08, 0.05, 'triangle');
  changed();
}
function replaceAll(newMeshes, stagger = 45){
  select(null);
  const removed = [...build.children];
  removed.forEach(m => build.remove(m));
  newMeshes.forEach((m, i) => spawn(m, i*stagger));
  history.push({ added:newMeshes, removed });
  changed();
}

function changed(){
  $('undoBtn').disabled = history.length === 0;
  $('redoBtn').disabled = redoStack.length === 0;
  $('saveBtn').disabled = build.children.length === 0;
}

// like P, but at a given size (the fry's base still lands on x,y,z)
function PS(type, size, x, y, z, ux, uy, uz, spin = 0){
  const m = P(type, x, y, z, ux, uy, uz, spin);
  if (isFry(type)) m.position.sub(m.geometry.userData.mid.clone().applyQuaternion(m.quaternion).multiplyScalar(1 - size));
  m.scale.setScalar(size); m.userData.size = size; m.updateMatrixWorld();
  return m;
}
function P(type, x, y, z, ux, uy, uz, spin = 0){
  const m = createPiece(type, newSeed());
  m.quaternion.copy(orient(new THREE.Vector3(ux, uy, uz), spin));
  m.position.set(x, y, z);
  if (isFry(type)) m.position.add(m.geometry.userData.mid.clone().applyQuaternion(m.quaternion));  // x,y,z is the fry's base
  m.updateMatrixWorld();
  return m;
}
const H = Math.PI/2;

  dino(){   // triceratops: a nugget body lying flat on four stubby legs, an upright nugget frill, three pointy-fry horns and a pointy tail

    for (const sx of [-1, 1]) for (const z of [-0.36, 0.34]) a.push(PS('stub', 1.15, 0.26*sx, 0, z, 0.16*sx, 1, z > 0 ? 0.06 : -0.06));

    a.push(PS('nugget', 1.1, 0, 1.28, 0.62, 0, 0.55, 1, 0));                   // frill, facing forward and leaning back
    a.push(P('horn', 0.22, 1.52, 0.8, 0.3, 1, 0.75, H));                       // brow horns

    a.push(PS('horn', 0.8, 0, 1.02, 0.92, 0, 0.6, 1, H));                      // nose horn

    return a;

  stego(){   // stegosaurus: three nuggets on edge in a row, a fan of fry plates along the back, a fry tail and a little nugget head
    const a = [];
    for (const sx of [-1, 1]) for (const z of [-0.55, 0.5]) a.push(PS('short', 1.08, 0.26*sx, 0, z, 0.08*sx, 1, 0));   // full-thickness fries, like real legs
    for (const [z, x, sp] of [[-0.62, 0.06, 0.2], [0.0, -0.05, -0.15], [0.6, 0.05, 0.1]]) a.push(PS('nugget', 0.92, x, 1.5, z, 1, 0.05, 0, H + sp));

    plates.forEach(([z, sz], i) => {

    a.push(PS('short', 0.95, 0, 1.45, -0.95, 0, 0.55, -1));                   // tail

    a.push(PS('stub', 1.05, 0, 1.3, 0.92, 0, -0.15, 1));                     // neck, full fry thickness

    for (const sx of [-1, 1]) for (const sz of [-1, 1]) a.push(P('long', 0.36*sx, 0, 0.5*sz, 0.05*sx, 1, 0.03*sz));

    a.push(P('short', 0.25, 0.82, -0.7, 0.05, 0.12, -1)); a.push(P('short', -0.25, 0.82, -0.7, -0.05, 0.12, -1));   // exhaust pipes, low and pointing back

// a preset is built by hand: hook every piece onto a lower piece it touches, so it holds together
function linkPreset(arr){
  const boxes = new Map(arr.map(m => { m.updateMatrixWorld(); return [m, new THREE.Box3().setFromObject(m).expandByScalar(0.03)]; }));
  const cy = m => boxes.get(m).getCenter(_gv).y;
  for (const m of arr){
    const b = boxes.get(m);
    if (b.min.y < 0.12) { m.userData.rest = { point: new THREE.Vector3(m.position.x, 0, m.position.z), normal: Y.clone(), type:'floor', preset:true }; continue; }
    let best = null, by = Infinity;
    for (const o of arr) if (o !== m && cy(o) < cy(m) - 0.01 && boxes.get(o).intersectsBox(b) && cy(o) < by) { best = o; by = cy(o); }
    if (!best){   // hung off the side (a tail, an ear): hook it to the nearest piece that doesn't already hang on it
      let bd = Infinity;
      for (const o of arr){ if (o === m || (o.userData.rest && o.userData.rest.obj === m)) continue;
        const d = boxes.get(o).distanceToPoint(boxes.get(m).getCenter(new THREE.Vector3())); if (d < bd) { bd = d; best = o; } }
    }
    if (best) m.userData.rest = { point: m.position.clone(), normal: Y.clone(), type: best.userData.type, obj: best, preset:true };
  }
}
function loadPreset(name){
  if (busy) return;
  const arr = PRESETS[name]();
  const turn = new THREE.Quaternion().setFromAxisAngle(Y, Math.PI/2);
  arr.forEach(m => { m.position.applyQuaternion(turn); m.quaternion.premultiply(turn); m.updateMatrixWorld(); });
  const box = new THREE.Box3(); arr.forEach(m => box.expandByObject(m));
  linkPreset(arr);
  replaceAll(arr);
  blip(520, 0.12, 0.06);
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  camTween = { t0: performance.now(), from: controls.target.clone(), to: new THREE.Vector3(0, c.y*0.9, 0),
               d0: camera.position.distanceTo(controls.target), d1: Math.max(12, Math.max(s.x, s.y, s.z)*3.1 / Math.min(1, camera.aspect*1.6)) };
}

let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
function shutter(){
  if (!state.sound) return; const a = audio(); if (!a) return;
  for (const [d, f] of [[0, 2400], [0.07, 1600]]){
    const len = 0.05, buf = a.createBuffer(1, a.sampleRate*len, a.sampleRate), x = buf.getChannelData(0);
    for (let i = 0; i < x.length; i++) x[i] = (Math.random()*2-1)*Math.pow(1 - i/x.length, 2);
    const s = a.createBufferSource(); s.buffer = buf;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 1.2;
    const g = a.createGain(); g.gain.value = 0.25;
    s.connect(bp).connect(g).connect(a.destination); s.start(a.currentTime + d);
  }
}
function snapPhoto(){
  // render without the selection highlight or gizmo, and grab the frame in the same task
  const sel = selected; select(null);
  const helper = tc.getHelper(), hv = helper.visible; helper.visible = false;
  camera.clearViewOffset(); camera.updateProjectionMatrix();   // centre the tray, ignoring the side panel
  renderFrame();
  const src = renderer.domElement, out = document.createElement('canvas');
  out.width = src.width; out.height = src.height;
  const x = out.getContext('2d');
  x.drawImage(src, 0, 0);
  resize();
  helper.visible = hv; if (sel && sel.parent === build) select(sel);
  const k = out.width/innerWidth;
  x.font = `700 ${Math.round(15*k)}px Outfit, "Noto Sans KR", sans-serif`; x.fillStyle = 'rgba(60,80,74,.85)';
  x.textBaseline = 'bottom'; x.fillText('감튀블록', 20*k, out.height - 18*k);
  return out;
}
async function savePhoto(){
  if (busy || !build.children.length) return;
  audio(); shutter();
  const f = $('flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  const canvas = snapPhoto();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  if (!blob) { toast('사진을 만들지 못했어요'); return; }
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const filename = `gamtwi-block-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
  let downloads = null;
  try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e) {}
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); toast('사진을 저장했어요'); }
    catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? '잠시 후 다시 눌러주세요' : '여기서는 저장할 수 없어요'); }
    return;
  }
  // opened as a plain file: ordinary browser download
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('사진을 저장했어요');
}

/* ---------- UI ---------- */
function buildThumbs(){
  const size = 160;
  const r2 = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
  r2.setSize(size, size); r2.toneMapping = THREE.NeutralToneMapping;
  const sc = new THREE.Scene(); addLights(sc, false);
  const pm2 = new THREE.PMREMGenerator(r2);
  sc.environment = pm2.fromScene(new RoomEnvironment(), 0.04).texture; sc.environmentIntensity = 0.45;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  const out = {};
  for (const t of TYPES){
    const m = createPiece(t, 12345 + t.length*77);
    const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3());
    m.position.sub(c);
    const g = new THREE.Group(); g.add(m);
    if (isFry(t)) { g.rotation.z = t === 'bent' ? -0.35 : -0.75; g.rotation.x = 0.25; }
    else if (t === 'nugget' || t === 'onion') { g.rotation.x = 0.95; g.rotation.y = 0.3; }
    else { g.rotation.x = 0.7; }
    sc.add(g);
    const s = new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3());
    const dist = Math.max(s.x, s.y, s.z) * 2.15;
    cam.position.set(0, 0, dist); cam.lookAt(0, 0, 0);
    r2.render(sc, cam);
    out[t] = r2.domElement.toDataURL('image/png');
    sc.remove(g);
  }
  r2.dispose(); r2.forceContextLoss?.();
  return out;
}

  if (down.tc) return;
  if (down.turn) {
    if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) down.moved = true;
    const a = trayAngleAt(e.clientX, e.clientY);
    if (down.moved && a !== null && down.turn.last !== null){
      let d = a - down.turn.last; d = Math.atan2(Math.sin(d), Math.cos(d));
      applyTurn(d); down.turn.total += d;
    }
    if (a !== null) down.turn.last = a;
    return;
  }
  if (down.sq) {
    down.moved = true;
    const sq = down.sq;
    if (Math.hypot(e.clientX - sq.sx, e.clientY - sq.sy) < 6) return;   // tiny wobble while holding: keep piling
    const hit = pick(e.clientX, e.clientY);
    if (hit && (!sq.last || hit.point.distanceTo(sq.last) > 0.035)) { squirt(hit, sq); sq.sx = e.clientX; sq.sy = e.clientY; }
    return;
  }
  if (down.scl) {
    if (!down.moved && Math.abs(e.clientY - down.y) > 3) { down.moved = true; $('selActs').classList.add('drag'); }
    if (down.moved) {
      const sz = Math.round(THREE.MathUtils.clamp(down.scl.s0*Math.exp((down.y - e.clientY)*0.006), SMIN, SMAX)*100)/100;
      if (sz !== selected.userData.size) { setSize(sz); applyCarry(down.scl.carry); }
    }
    return;
  }
  if (down.rot) {
    if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 3) { down.moved = true; tc.getHelper().visible = false; $('selActs').classList.add('drag'); }
    if (down.moved) { stepRot(down.rot, e.clientX - down.lx, e.clientY - down.ly, !e.ctrlKey); down.lx = e.clientX; down.ly = e.clientY; }
    return;
  }
  if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down.moved = true; if (down.drag) { tc.getHelper().visible = false; $('selActs').classList.add('drag'); } }
  const d = down.drag;
  if (!d || !down.moved) return;
  const hit = pick(e.clientX + d.dx, e.clientY + d.dy, d.ex);
  if (!hit) return;
  if (hit.object.userData.type === 'floor' && !inTray(hit.point)) return;
  const rest = restFromHit(hit);
  d.m.userData.rest = rest;
  d.m.position.copy(seatPos(d.m, rest));
  if (!d.lifted) { d.lifted = true; blip(500, 0.05, 0.03); }
  const k2 = rest.type + (rest.obj ? rest.obj.id : '');
  if (d.lastType !== k2) { if (d.lastType) blip(rest.type === 'floor' ? 380 : 620, 0.05, 0.035); d.lastType = k2; }
  syncTwin(); applyCarry(d.carry);
});

function endPointer(e, cancel){
  const d = down; down = null;
  if (!tc.dragging) controls.enabled = true;
  tc.getHelper().visible = !!tc.object;
  $('selActs').classList.remove('drag');
  cv.style.cursor = state.squeeze ? KCUR : 'default';
  if (!d || busy || d.tc) return;
  if (d.turn) {
    if (d.moved) { if (Math.abs(d.turn.total) > 1e-4) { history.push({ added:[], removed:[], turn: d.turn.total }); changed(); } thud(); }
    else if (!cancel) turnTray(-Math.PI/4);
    return;
  }
  if (d.sq) { clearInterval(d.sq.timer); const m = finishBead(d.sq); if (m) { history.push({ added: [m], removed:[] }); changed(); } return; }
  if (d.rot) { endRot(d.rot); if (d.rot.moved) thud(); return; }
  if (d.scl) { if (d.moved) { const h = { added:[], removed:[], transforms: d.scl.snap }; history.push(h); settle(h, selGroup()); thud(); changed(); } return; }
  if (d.drag && d.moved && d.drag.lifted) {
    const h = { added:[], removed:[], transforms: d.drag.snap }; history.push(h); settle(h, selGroup());
    thud(); changed(); return;
  }
  if (cancel || d.moved || performance.now() - d.t > 700) return;
  const hit = pick(e.clientX, e.clientY);
  if (d.b === 2) { if (hit && hit.object.userData.piece) { select(hit.object); act('del'); } return; }
  if (!hit || !hit.object.userData.piece) select(null);
}
cv.addEventListener('pointerup', e => endPointer(e, false));
cv.addEventListener('pointercancel', e => endPointer(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());

/* resize */
const dockMQ = matchMedia('(max-width:640px) and (orientation:portrait)');
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  const examples = document.querySelector('.panel .examples');
  if (dockMQ.matches) examples.style.removeProperty('--preset-max-height');
  else {
    // The initial list ends exactly after the fourth preset; later presets remain scrollable.
    const car = examples.querySelector('[data-ex="car"]');
    const height = car.getBoundingClientRect().bottom - examples.getBoundingClientRect().top + examples.scrollTop;
    examples.style.setProperty('--preset-max-height', Math.ceil(height) + 'px');
  }
  if (dockMQ.matches){
    // bottom dock: frame the tray in the space above it
    const dh = $('panel').offsetHeight;
    document.documentElement.style.setProperty('--dock', dh + 'px');
    camera.setViewOffset(w, h, 0, dh*0.5 - h*0.02, w, h);
  } else {
    const pw = $('panel').offsetWidth;
    camera.setViewOffset(w, h, pw*0.5, -h*0.03, w, h);
  }
  camera.updateProjectionMatrix();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  const card = b.closest('.card'); card.dataset.tab = b.dataset.tab;
  card.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  blip(640, 0.04, 0.03);
});
addEventListener('resize', resize);
new ResizeObserver(resize).observe($('panel'));
document.fonts.ready.then(resize);
resize();
{ const k = 1.0/Math.min(1, camera.aspect*1.5); camera.position.multiplyScalar(k); }

// Shadows only need another pass when a caster, tray, or lighting changes.
const shadowSnapshots = new WeakMap();
let shadowCasterCount = -1, shadowLook = -1;
function updateShadowCache(){
  let count = 0, dirty = lookT !== shadowLook;
  scene.traverse(o => {
    if (!o.castShadow && !o.isLight && o !== trayRig && o !== trayTurn && o !== build) return;
    count++;
    const old = shadowSnapshots.get(o);
    if (!old || old.visible !== o.visible || !old.p.equals(o.position) || !old.q.equals(o.quaternion) || !old.s.equals(o.scale)){
      dirty = true;
      if (old){ old.p.copy(o.position); old.q.copy(o.quaternion); old.s.copy(o.scale); old.visible = o.visible; }
      else shadowSnapshots.set(o,{p:o.position.clone(),q:o.quaternion.clone(),s:o.scale.clone(),visible:o.visible});
    }
  });
  if (dirty || count !== shadowCasterCount) renderer.shadowMap.needsUpdate = true;
  shadowCasterCount = count; shadowLook = lookT;
}

/* loop */
function tick(now){
  stepLook(now); stepFalls(now); stepFlick(now); stepFlying(now);
  for (let i = anims.length - 1; i >= 0; i--){
    const a = anims[i]; const t = (now - a.t0)/a.dur;
    if (a.kind === 'drop'){
      if (now < a.t0) continue;
      a.m.visible = true;
      if (down && down.drag && down.drag.lifted && selGroup().includes(a.m)) { anims.splice(i, 1); continue; }
      const dt = a.last ? Math.min(0.05, (now - a.last)/1000) : 0; a.last = now;
      a.v -= 32*dt; a.m.position.y += a.v*dt;
      if (a.m.position.y <= a.yRest){
        a.m.position.y = a.yRest;
        if (a.bounces === 0) thud();
        a.bounces++; a.v = -a.v*0.32;
        if (Math.abs(a.v) < 1.2 || a.bounces > 2) anims.splice(i, 1);
      }
      continue;
    }
    if (t < 0) continue;
    if (a.kind === 'in'){
      const sz = a.m.userData.size || 1;
      a.m.scale.setScalar(Math.max(0.0001, sz*backOut(Math.min(1, t))));
      if (t >= 1) { a.m.scale.setScalar(sz); anims.splice(i, 1); }
    } else {
      if (a.sound) { a.sound = false; crunch(); }
      const k = Math.min(1, t);
      const sz = a.m.userData.size || 1;
      a.m.scale.setScalar(Math.max(0.0001, sz*(1 - k) * (1 + 0.25*Math.sin(k*Math.PI))));
      if (t >= 1) { build.remove(a.m); a.m.scale.setScalar(sz); anims.splice(i, 1); }
    }
  }
  stepTurn(now);
  if (camTween){
    const t = Math.min(1, Math.max(0, (now - camTween.t0)/700)), e = 1 - Math.pow(1-t, 3);   // rAF time can trail performance.now()
    controls.target.lerpVectors(camTween.from, camTween.to, e);
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, camTween.d0 + (camTween.d1 - camTween.d0)*e);
    if (t >= 1) camTween = null;
  }
  controls.update();
  updateShadowCache();
  renderFrame();
  requestAnimationFrame(tick);
}
syncUI(); changed();
requestAnimationFrame(tick);
requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => $('loader').classList.add('done'), 350)));

// test hook
window.__game = { redo, useTile, setSqueeze, loadPreset, state, build, addPiece, pick, camera, controls, tc, setMode, select, act, settle, history, undo, falls };
