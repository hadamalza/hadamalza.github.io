<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#d9f1f4" />
<title>제초 자격증 시험</title>
<meta name="description" content="15초 동안 풀을 쏙쏙 뽑고 나만의 제초 자격증을 받아보세요!" />
<meta property="og:type" content="website" />
<meta property="og:title" content="제초 자격증 시험" />
<meta property="og:description" content="15초 동안 풀을 쏙쏙 뽑고 나만의 제초 자격증을 받아보세요!" />
<meta property="og:url" content="https://hadamalza.github.io/weed-license/" />
<meta property="og:image" content="https://hadamalza.github.io/weed-license/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://hadamalza.github.io/weed-license/og-image.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet" />
<link rel="preload" href="vendor/three.module.min.js" as="script" crossorigin />
<style>
:root{
  --ink:#4b4440;--cream:#fffaf0;--paper:rgba(255,250,240,.94);--yellow:#ffd95e;--yellow-d:#f4c43c;
  --green:#5fa865;--mint:#dff4d8;--red:#e8646f;--sky:#d9f1f4;
  --line:3px solid var(--ink);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:'Gamja Flower',cursive;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hidden{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:var(--line);border-width:3.5px;background:#fff;
  border-radius:18px 15px 19px 16px;padding:12px 20px;font-size:23px;line-height:1;transition:transform .14s cubic-bezier(.3,.7,.4,1.4),background .15s}
.btn:hover{transform:translateY(-2px) rotate(-.6deg)}
.btn:active{transform:translateY(2px) scale(.97)}
.btn.primary{background:var(--yellow)}
.btn.primary:hover{background:#ffe07a}
.btn svg{width:22px;height:22px;flex:none}
.icon-btn{width:52px;height:52px;border-radius:50% 47% 52% 48%;border:var(--line);background:var(--paper);display:grid;place-items:center;
  transition:transform .14s cubic-bezier(.3,.7,.4,1.4)}
.icon-btn:hover{transform:rotate(-6deg) scale(1.05)}.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:24px;height:24px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:var(--line);border-radius:999px;padding:6px 16px 6px 8px;
  font-size:30px;line-height:1;min-height:52px}
.pill img{width:38px;height:38px;object-fit:contain}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--sky);transition:opacity .6s ease}
#loader.done{opacity:0;pointer-events:none}
.load-wrap{display:grid;justify-items:center;gap:18px}
.load-sprout{width:96px;height:96px;object-fit:contain;animation:sprout 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
.load-bar{width:160px;height:14px;border:var(--line);border-radius:99px;overflow:hidden;background:#fff}
.load-bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
@keyframes sprout{from{transform:scale(.9,1.06) rotate(-4deg)}to{transform:scale(1.05,.95) rotate(4deg)}}

/* ---------- intro ---------- */
#intro{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + clamp(26px,6vh,64px)) 20px calc(var(--safe-b) + clamp(28px,7vh,72px));pointer-events:none}
#intro>*{pointer-events:auto}
.title{margin:0;word-break:keep-all;text-align:center;font-weight:400;font-size:clamp(58px,10vw,118px);line-height:.95;letter-spacing:-3px;color:var(--ink);
  text-shadow:0 0 18px rgba(255,255,255,.85),0 0 4px rgba(255,255,255,.9);animation:title-in .9s cubic-bezier(.2,.8,.2,1.2) both}
.title .hl{position:relative;display:inline-block;color:#4f9a58}
.title .hl:after{content:"";position:absolute;z-index:-1;left:-2%;right:-2%;bottom:8%;height:26%;background:var(--yellow);border-radius:50%;transform:rotate(-2deg)}
@keyframes title-in{from{opacity:0;transform:translateY(-30px) scale(.9) rotate(-3deg)}}
.intro-bottom{display:grid;justify-items:center;gap:14px;animation:title-in .9s .15s cubic-bezier(.2,.8,.2,1.2) both}
.start-btn{font-size:clamp(28px,4.4vw,36px);padding:18px 34px 18px 40px;border-width:4px;border-radius:24px 20px 26px 21px;transform:rotate(-1deg)}
.start-btn:hover{transform:rotate(-2deg) translateY(-3px) scale(1.03)}
.start-btn .go{width:28px;height:28px}
.best-chip{font-size:22px;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;padding:5px 14px;display:inline-flex;gap:6px;align-items:center}
.best-chip svg{width:20px;height:20px}
#result .home-corner{position:absolute;top:calc(var(--safe-t) + 14px);left:14px;z-index:20}
.corner{position:fixed;top:calc(var(--safe-t) + 14px);right:14px;display:flex;gap:10px;z-index:20}

/* ---------- HUD ---------- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;padding:calc(var(--safe-t) + 12px) clamp(12px,3vw,32px) 0;pointer-events:none;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
#hud.off{transform:translateY(-140%);opacity:0}
#hud>*{pointer-events:auto}
.hud-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud-right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
#scorePill b{min-width:1.1em;text-align:center;font-weight:400;display:inline-block}
#scorePill.bump b{animation:bump .3s cubic-bezier(.3,.7,.4,1.6)}
#scorePill.hurt{animation:hurt .4s}
.grade{font-size:22px;background:#fff;border:2.5px solid var(--ink);border-radius:12px 10px 13px 9px;padding:5px 9px;transform:rotate(-3deg);line-height:1}
.grade.up{animation:grade-up .6s cubic-bezier(.3,.7,.4,1.6)}
.grade[data-l="1"]{background:linear-gradient(120deg,#ffd0e3,#fff1a8,#c8f5d1,#c6dcff)}
.grade[data-l="2"]{background:#e2e4e8}.grade[data-l="3"]{background:#d8c27a}.grade[data-l="4"]{background:#cfe3c4}
@keyframes bump{40%{transform:scale(1.5) rotate(-6deg)}}
@keyframes hurt{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes grade-up{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1) rotate(-3deg)}}
.timer{position:relative;width:84px;height:84px;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .bg{fill:var(--paper);stroke:var(--ink);stroke-width:3.5}
.timer .track{fill:none;stroke:#e9e3d2;stroke-width:7}
.timer .bar{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.timer b{position:relative;font-weight:400;font-size:38px;line-height:1}
.timer.danger .bar{stroke:var(--red)}
.timer.danger{animation:tick .5s ease-in-out infinite alternate}
@keyframes tick{to{transform:scale(1.08)}}
#comboPill{gap:4px;padding:6px 14px;position:relative;overflow:hidden;transition:opacity .2s,transform .2s cubic-bezier(.3,.7,.4,1.6);color:#d9534f}
#comboPill.idle{opacity:0;transform:scale(.6)}
#comboPill svg{width:26px;height:26px}
#comboPill .meter{position:absolute;left:0;bottom:0;height:5px;background:#ff9a5c;width:100%;transform-origin:left;border-radius:0 3px 3px 0}
#comboPill.bump{animation:bump .3s cubic-bezier(.3,.7,.4,1.6)}

/* ---------- countdown & stamp ---------- */
#countdown{display:grid;place-items:center;pointer-events:none}
#countdown span{font-size:min(36vw,230px);line-height:1;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  text-shadow:0 8px 0 rgba(75,68,64,.18);animation:stamp .62s cubic-bezier(.2,.9,.3,1.3) both}
#countdown span.go{color:var(--yellow)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-8deg);opacity:0}35%{transform:scale(.92) rotate(2deg);opacity:1}55%{transform:scale(1.04)}80%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}

/* ---------- pops ---------- */
#pops{pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;font-size:34px;line-height:1;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;white-space:nowrap;
  will-change:transform;pointer-events:none}
.pop i{display:block;font-style:normal;animation:pop .85s cubic-bezier(.2,.8,.3,1) forwards}
.pop.combo i{color:var(--yellow);font-size:40px}
.pop.bad i{color:#ff8a92;animation-name:pop-bad}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-110%) scale(1.25);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
@keyframes pop-bad{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-90%) scale(1.3) rotate(-8deg);opacity:1}60%{transform:translate(-50%,-110%) rotate(6deg)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
#flash{background:radial-gradient(ellipse at center,transparent 45%,rgba(232,100,111,.26));opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:1;transition:none}

/* ---------- pause ---------- */
#pause{display:grid;place-items:center;pointer-events:auto;background:rgba(255,250,240,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pause-box{display:flex;gap:18px;align-items:center}
.pause-box .icon-btn{width:92px;height:92px;border-width:4px}
.pause-box .icon-btn.play{background:var(--yellow);width:118px;height:118px}
.pause-box .icon-btn svg{width:40px;height:40px}

/* ---------- result ---------- */
#result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,22px);
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 18px);background:rgba(255,250,240,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow:hidden}
.cert{position:relative;width:min(600px,92vw,calc((100svh - 250px) * 1.333));aspect-ratio:1448/1086;animation:cert-in .9s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:50% 100%}
@keyframes cert-in{0%{transform:translateY(-70vh) rotate(-14deg);opacity:0}60%{transform:translateY(12px) rotate(2deg);opacity:1}80%{transform:translateY(-4px) rotate(-1.5deg)}100%{transform:rotate(-1deg)}}
.cert .photo,.cert video{position:absolute;left:var(--hx,61.3%);top:var(--hy,24.5%);width:var(--hw,23%);height:var(--hh,33%);border-radius:4px;background:#f6ecd6 center/cover no-repeat;object-fit:cover}
.cert video{background:#222;transform:scaleX(-1) scale(1.28)}
.cert .art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.cert .shine{position:absolute;inset:0;overflow:hidden;pointer-events:none;-webkit-mask:var(--mask) center/contain no-repeat;mask:var(--mask) center/contain no-repeat}
.cert .shine:after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-18deg);animation:shine 1.1s 1s ease-in-out both}
@keyframes shine{to{left:120%}}
.cam-badge{position:absolute;left:calc(var(--hx,61.3%) + var(--hw,23%));top:calc(var(--hy,24.5%) + var(--hh,33%));transform:translate(-50%,-50%);width:clamp(40px,8%,52px);height:auto;aspect-ratio:1;border-radius:50%;
  border:var(--line);background:var(--yellow);display:grid;place-items:center;transition:transform .15s}
.cam-badge:hover{transform:translate(-50%,-50%) scale(1.1) rotate(-8deg)}
.cam-badge svg{width:55%;height:55%}
.cert.camera .cam-badge{display:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise .6s .55s cubic-bezier(.2,.8,.3,1.2) both}
.stats .pill{font-size:28px;min-height:48px}
.stats .pill img{width:34px;height:34px}
.stats .pill svg{width:28px;height:28px;margin-left:4px}
.stats .pill.bad{color:#c9505a}
.stats .pill.best{background:var(--yellow)}
.stats .pill.best.new{animation:wiggle 1s 1.2s ease-in-out 2}
.stats .guide-pill{background:#bfe3a5;font:inherit;font-size:24px;color:var(--ink);cursor:pointer;gap:8px;padding-right:18px;transition:transform .14s cubic-bezier(.3,.7,.4,1.4)}.stats .guide-pill:hover{transform:rotate(-2deg) scale(1.04)}.stats .guide-pill:active{transform:scale(.94)}.stats .guide-pill svg{width:24px;height:24px}
@keyframes wiggle{25%{transform:rotate(-5deg) scale(1.08)}75%{transform:rotate(5deg) scale(1.08)}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise .6s .7s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
#confetti{pointer-events:none;overflow:hidden;z-index:55}
#confetti i{position:absolute;top:-30px;width:12px;height:16px;border:2px solid var(--ink);border-radius:60% 40% 60% 40%;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}


/* ---------- guide book ---------- */
.start-row{display:flex;align-items:center;gap:12px}
.book-btn{background:#bfe3a5;border-width:4px;font-size:clamp(22px,3.4vw,27px);padding:16px 20px;border-radius:20px 18px 22px 17px;transform:rotate(1.5deg)}
.book-btn:hover{background:#cdeab6}
.book-btn svg{width:26px;height:26px}
#watermark{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(var(--safe-b) + 8px);z-index:5;font-size:14px;color:var(--ink);opacity:.38;pointer-events:none;letter-spacing:.5px}
#guide{display:grid;place-items:center;pointer-events:auto;background:rgba(75,68,64,.42);z-index:70;padding:calc(var(--safe-t) + 14px) 12px calc(var(--safe-b) + 14px);perspective:2200px;overflow:hidden}
.book{position:relative;width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;transform-style:preserve-3d;
  animation:book-open 1.15s cubic-bezier(.45,0,.2,1) both}
.half{position:relative;background:#8fc27a;border:4px solid var(--ink);padding:12px;min-width:0}
.half.l{border-radius:22px 4px 4px 24px;border-right:0;padding-right:0}
.half.r{border-radius:4px 20px 22px 4px;border-left:0;padding-left:0;grid-column:2;grid-row:1}
.leaf{grid-column:1;grid-row:1;position:relative;transform-origin:right center;transform-style:preserve-3d;animation:leaf-open 1.15s cubic-bezier(.45,0,.2,1) both}
.leaf .half.l{backface-visibility:hidden;-webkit-backface-visibility:hidden;height:100%}
.leaf .back{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#8fc27a;border:4px solid var(--ink);border-radius:4px 20px 22px 4px;display:grid;place-items:center}
.leaf .back b{font-weight:400;font-size:clamp(52px,7.6vw,88px);line-height:1.05;text-align:center;color:#fffaf0;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:rotate(-4deg)}
.leaf .back img{position:absolute;width:30%;bottom:12%;right:12%;transform:rotate(8deg)}
@keyframes book-open{
  0%{transform:translateX(-25%) translateY(60px) scale(.6) rotateX(18deg)}
  28%{transform:translateX(-25%) translateY(0) scale(1) rotateX(6deg)}
  100%{transform:none}}
#guide:not(.hidden){animation:fade-in .25s ease both}
@keyframes fade-in{from{background:rgba(75,68,64,0)}}
@keyframes leaf-open{0%,28%{transform:translateZ(3px) rotateY(179.6deg)}100%{transform:translateZ(1px) rotateY(0)}}
.page{position:relative;height:100%;background:#fffaf0;border:3px solid var(--ink);padding:16px 14px 10px}
.half.l .page{border-radius:14px 2px 2px 14px;border-right-width:1.5px;box-shadow:inset -16px 0 18px -14px rgba(75,68,64,.32)}
.half.r .page{border-radius:2px 14px 14px 2px;border-left-width:1.5px;box-shadow:inset 16px 0 18px -14px rgba(75,68,64,.32)}
.page h3{margin:0;font-weight:400;font-size:36px;display:flex;align-items:center;justify-content:center;gap:10px}
.page h3 .tag{font-size:22px;border:2.5px solid var(--ink);border-radius:99px;padding:2px 12px;transform:rotate(-4deg)}
.half.l h3 .tag{background:var(--yellow)}.half.r h3 .tag{background:#ffc6cc}
.entries{position:relative;aspect-ratio:1/.9}
.entry{position:absolute;margin:0;left:var(--x);top:var(--y);width:var(--w);transform:translateX(-50%) rotate(var(--r,0deg));display:grid;justify-items:center}
.entry img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(75,68,64,.1))}
.entry figcaption{font-size:clamp(17px,2.1vw,21px);line-height:1;margin-top:2px;white-space:nowrap}
.book-close{position:absolute;top:-18px;right:-14px;width:48px;height:48px;z-index:4;background:var(--yellow);transform:translateZ(40px);transition:transform .15s}
.book-close:hover{transform:translateZ(40px) rotate(-8deg) scale(1.06)}.book-close:active{transform:translateZ(40px) scale(.92)}
@media (max-width:720px){
  .book{grid-template-columns:1fr;animation:book-rise .5s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes book-rise{from{transform:translateY(40px) scale(.9);opacity:0}}
  .leaf{animation:none;grid-column:1;grid-row:1}.leaf .back{display:none}
  .half.r{grid-column:1;grid-row:2}
  .half.l{border-radius:22px 22px 0 0;border-right:4px solid var(--ink);border-bottom:0;padding:12px 12px 0}
  .half.r{border-radius:0 0 22px 22px;border-left:4px solid var(--ink);border-top:0;padding:0 12px 12px}
  .half.l .page{border-radius:14px 14px 2px 2px;border-right-width:3px;border-bottom-width:1.5px;box-shadow:none}
  .half.r .page{border-radius:2px 2px 14px 14px;border-left-width:3px;border-top-width:1.5px;box-shadow:none}
  .page{padding:10px 10px 6px}.page h3{font-size:28px}
  .entries{aspect-ratio:1/.86}
  .half.l .entry:nth-child(1){--x:30%!important;--y:0%!important;--w:42%!important}
  .half.l .entry:nth-child(2){--x:77%!important;--y:14%!important;--w:30%!important}
  .half.l .entry:nth-child(3){--x:52%!important;--y:50%!important;--w:36%!important}
  .half.r .entry:nth-child(1){--x:17%!important;--y:0%!important;--w:10.5%!important}
  .half.r .entry:nth-child(2){--x:50%!important;--y:0%!important;--w:24%!important}
  .half.r .entry:nth-child(3){--x:83%!important;--y:6%!important;--w:24%!important}
  .half.r .entry:nth-child(4){--x:18%!important;--y:55%!important;--w:10%!important}
  .half.r .entry:nth-child(5){--x:50%!important;--y:48%!important;--w:24%!important}
  .half.r .entry:nth-child(6){--x:83%!important;--y:54%!important;--w:22%!important}
  .start-row{flex-direction:column-reverse;gap:10px}
  .book-close{top:6px;right:6px}
}

/* ---------- profile sheet ---------- */
#sheet{display:grid;place-items:end center;pointer-events:auto;background:rgba(75,68,64,.35);z-index:60}
.sheet-box{width:min(420px,100%);margin:0 12px calc(var(--safe-b) + 14px);background:var(--cream);border:4px solid var(--ink);border-radius:26px 22px 28px 24px;padding:16px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:rise .3s cubic-bezier(.2,.8,.3,1.2)}
.sheet-box .btn{flex-direction:column;padding:18px 10px;gap:8px;font-size:22px}
.sheet-box .btn svg{width:34px;height:34px}
.sheet-box .close{grid-column:1/-1;background:transparent;border-color:transparent;padding:8px;font-size:20px}
.presets{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.preset{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px 12px 15px 11px;background:#f6ecd6 center/cover no-repeat;position:relative;transition:transform .14s cubic-bezier(.3,.7,.4,1.4)}
.preset:hover{transform:rotate(-2deg) scale(1.04)}
.preset[aria-pressed="true"]{outline:4px solid var(--yellow);outline-offset:2px}

<script type="module">
import * as THREE from './vendor/three.module.min.js';

/* =========================================================
   Config — same core rules as the 2D version
   ========================================================= */
const GAME_TIME = 15, COMBO_WINDOW = 1.45, WEED_COUNT = 12;
const RANKS = [24, 18, 12, 6]; // 1급..4급 thresholds, below → 5급
const rankLevel = n => { for (let i = 0; i < RANKS.length; i++) if (n >= RANKS[i]) return i + 1; return 5; };
// heights tuned by visual weight (bold-outlined weed-2 reads big, so it is drawn smaller)
const WEEDS = [ {key:'weed-1', h:.96}, {key:'weed-2', h:.6}, {key:'weed-3', h:.84} ];
const CROPS = [ {key:'flower-1', h:1.02}, {key:'flower-2', h:.98}, {key:'flower-3', h:1.06},
                {key:'cabbage', h:.74}, {key:'carrot', h:.94}, {key:'strawberry', h:.82} ];
const CHARS = [ {key:'usagi', h:1.75, x:-1}, {key:'chiikawa', h:1.5, x:0}, {key:'hachiware', h:1.55, x:1} ];
const INK = 0x4b4440;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const backOut = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

/* =========================================================
   Renderer / scene
   ========================================================= */
const canvas = $('#scene');
const isMobile = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 2 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOG = new THREE.Color(0xe4f2dc);
scene.fog = new THREE.Fog(FOG, 34, 110);
const camera = new THREE.PerspectiveCamera(38, 1, .1, 400);

// lights
const hemi = new THREE.HemisphereLight(0xfffbef, 0x9fc77c, 1.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff8ea, 1.55);
sun.position.set(-7, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 14, bottom: -14, near: 1, far: 50 });
sun.shadow.bias = -.0008; sun.shadow.normalBias = .03;
scene.add(sun);

// toon ramp
const ramp = new THREE.DataTexture(new Uint8Array([150,150,150,255, 205,205,205,255, 255,255,255,255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: ramp, ...extra });

// inverted-hull ink outline, matching the hand-drawn art
const outlineMats = new Map();
function outline(mesh, thick = .035) {
  const key = thick.toFixed(4);
  let m = outlineMats.get(key);
  if (!m) {
    m = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
    m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `vec3 transformed = position + normal * ${key};`); };
    m.customProgramCacheKey = () => 'ol' + key;
    outlineMats.set(key, m);
  }
  const o = new THREE.Mesh(mesh.geometry, m);
  mesh.add(o);
  return mesh;
}

/* ---------- canvas textures ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const blobTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(60,70,30,.55)'); gr.addColorStop(.55, 'rgba(60,70,30,.32)'); gr.addColorStop(1, 'rgba(60,70,30,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const holeTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(92,64,40,1)'); gr.addColorStop(.55, 'rgba(120,86,54,.95)'); gr.addColorStop(.72, 'rgba(150,112,70,.6)'); gr.addColorStop(1, 'rgba(150,112,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const ringTex = canvasTex(128, 128, (g) => {
  g.strokeStyle = '#fff'; g.lineWidth = 9; g.beginPath(); g.arc(64, 64, 52, 0, Math.PI * 2); g.stroke();
});
// ground: green with crisp cream patches like the original meadow
const GROUND_SIZE = 70;
const groundTex = canvasTex(2048, 2048, (g, w, h) => {
  g.fillStyle = '#cfe89c'; g.fillRect(0, 0, w, h);
  const s = w / GROUND_SIZE;
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const patch = (x, y, rx, ry, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(w / 2 + x * s, h / 2 + y * s, rx * s, ry * s, r() * .5 - .25, 0, Math.PI * 2); g.fill(); };
  for (let i = 0; i < 70; i++) {
    const x = (r() - .5) * 60, y = (r() - .5) * 60, rx = 1.6 + r() * 3.2, ry = rx * (.45 + r() * .25);
    patch(x, y, rx * 1.05, ry * 1.08, 'rgba(250,246,214,.5)');
    patch(x, y, rx, ry, '#fbf7dc');
  }
  for (let i = 0; i < 260; i++) patch((r() - .5) * 64, (r() - .5) * 64, .3 + r() * .8, .15 + r() * .3, 'rgba(160,200,110,.35)');
  // darker grass speck strokes
  g.strokeStyle = 'rgba(102,115,78,.0)'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 0; i++) {
    const x = w / 2 + (r() - .5) * 64 * s, y = h / 2 + (r() - .5) * 64 * s, k = 5 + r() * 4;
    g.beginPath(); g.moveTo(x - k, y - k * .9); g.lineTo(x - k * .2, y + k * .4); g.moveTo(x, y - k * 1.2); g.lineTo(x, y + k * .4); g.moveTo(x + k, y - k * .9); g.lineTo(x + k * .2, y + k * .4); g.stroke();
  }
  // soft fade to plain green at the edges
  const gr = g.createRadialGradient(w / 2, h / 2, w * .33, w / 2, h / 2, w * .5);
  gr.addColorStop(0, 'rgba(207,232,156,0)'); gr.addColorStop(1, 'rgba(207,232,156,1)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
groundTex.anisotropy = 8;

/* =========================================================
   World
   ========================================================= */
// sky dome
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x8fd0ea) }, mid: { value: new THREE.Color(0xcdeef3) }, bot: { value: new THREE.Color(0xfff6e2) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: `uniform vec3 top,mid,bot; varying vec3 vP;
      void main(){ float h = vP.y; vec3 c = mix(bot, mid, smoothstep(-.02,.12,h)); c = mix(c, top, smoothstep(.12,.6,h)); gl_FragColor = vec4(c,1.);
      #include <colorspace_fragment>
      }`
  }));
  sky.material.uniforms.top.value.convertSRGBToLinear(); sky.material.uniforms.mid.value.convertSRGBToLinear(); sky.material.uniforms.bot.value.convertSRGBToLinear();
  sky.renderOrder = -10; scene.add(sky);
}
// ground
const baseGround = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), toon(0xcfe89c));
baseGround.rotation.x = -Math.PI / 2; baseGround.position.y = -.02; baseGround.receiveShadow = true; scene.add(baseGround);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), toon(0xffffff, { map: groundTex }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function buildFence(W, D) {

  const hw = W / 2 + 1.0, hd = D / 2 + 1.0, backZ = -hd - .9;

    const c = new THREE.Mesh(capG, wood); c.position.set(x, .86, z); fence.add(outline(c, .03));

const windUniform = { value: 0 };

/* =========================================================
   Field layout & camera framing
   ========================================================= */
let FW = 10, FD = 5.6;
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
const playCam = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
let PITCH = .93, PLANT_SCALE = 1;
function layoutField() {
  const aspect = innerWidth / innerHeight;
  FW = clamp(aspect * 6.6, 4.8, 10.6);
  FD = clamp(54 / FW, 5.2, 8.6);
  PITCH = aspect < .8 ? 1.08 : .93; PLANT_SCALE = aspect < .8 ? 1.12 : 1;
  if (aspect < .8) { FW = 4.3; FD = clamp(4.3 / aspect * .78, 6.6, 9.4); }
  buildFence(FW, FD);
  const backZ = -FD / 2 - 1.55;
  const spread = Math.min(FW / 2 - .3, 2.5);
  chars.forEach(c => { c.base.set(c.d.x * spread, 0, backZ + (c.d.x === 0 ? .25 : 0)); });
  camera.fov = aspect < 1 ? 46 : 36; camera.aspect = aspect; camera.updateProjectionMatrix();
  fitPlayCamera();
}
function fitPlayCamera() {
  const hudPx = (innerWidth < 640 ? 96 : 110) + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-t')) || 0);
  const yTop = 1 - 2 * hudPx / innerHeight + .02, yBot = -.94, xLim = .93;
  const hw = FW / 2, hd = FD / 2;
  const pts = [];
  for (const x of [-hw, hw]) for (const z of [-hd, hd]) { pts.push(new THREE.Vector3(x, 0, z)); pts.push(new THREE.Vector3(x, 1, z)); }
  chars.forEach(c => pts.push(c.base.clone().setY(c.d.h * .85)));
  const dir = new THREE.Vector3(0, Math.sin(PITCH), Math.cos(PITCH));
  const target = new THREE.Vector3(0, .3, 0);
  const cam = camera.clone(); const v = new THREE.Vector3();
  const measure = d => {
    cam.position.copy(target).addScaledVector(dir, d); cam.lookAt(target); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    let xmax = 0, ymin = 9, ymax = -9;
    for (const p of pts) { v.copy(p).project(cam); xmax = Math.max(xmax, Math.abs(v.x)); ymin = Math.min(ymin, v.y); ymax = Math.max(ymax, v.y); }
    return { xmax, ymin, ymax };
  };
  let d = 14;
  for (let it = 0; it < 4; it++) {
    let lo = 4, hi = 80;
    for (let k = 0; k < 30; k++) {
      d = (lo + hi) / 2; const m = measure(d);
      if (m.xmax <= xLim && (m.ymax - m.ymin) <= (yTop - yBot)) hi = d; else lo = d;
    }
    d = hi; const m = measure(d);
    const cur = (m.ymax + m.ymin) / 2, want = (yTop + yBot) / 2;
    const half = d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const up = new THREE.Vector3(0, Math.cos(PITCH), -Math.sin(PITCH));
    target.addScaledVector(up, (cur - want) * half * .9);
  }
  playCam.target.copy(target); playCam.pos.copy(target).addScaledVector(dir, d);
}

const S = { mode: 'loading', score: 0, mistakes: 0, combo: 1, best: 1, time: GAME_TIME, last: -9, clock: 0, paused: false, level: 5, lastTick: 99, missed: 0, spawnT: 0 };

function spotFor(w) {
  const hw = FW / 2 - .45, hd = FD / 2 - .35;
  let best = null, bestD = -1;
  for (let i = 0; i < 50; i++) {
    const x = rand(-hw, hw), z = rand(-hd, hd);
    let dmin = 99;
    for (const p of plants) { if (p.state === 'gone') continue; const dx = (p.root.position.x - x), dz = (p.root.position.z - z) * 1.25; dmin = Math.min(dmin, Math.hypot(dx, dz) - (p.w + w) * .38); }
    if (dmin > .18) return new THREE.Vector3(x, 0, z);
    if (dmin > bestD) { bestD = dmin; best = new THREE.Vector3(x, 0, z); }
  }
  return best;
}
function spawn(kind, def, delay = 0, life = Infinity) {
  def = def || (kind === 'weed' ? WEEDS[Math.floor(Math.random() * WEEDS.length)] : CROPS[Math.floor(Math.random() * CROPS.length)]);
  const s = makeSprite(def.key, def.h * PLANT_SCALE * rand(.92, 1.1));
  const p = { ...s, kind, def, state: 'grow', t: -delay, age: 0, life, growDur: life < 99 ? .26 : .5, ph: rand(0, 6), hover: 0, vel: new THREE.Vector3(), spin: 0, flip: Math.random() < .5 ? -1 : 1 };
  if (p.flip < 0) p.mesh.scale.x *= -1;
  p.root.position.copy(spotFor(s.w));
  p.anim.scale.setScalar(.0001);
  plants.push(p);
  return p;
}
function disposePlant(p) { scene.remove(p.root); p.mat.dispose(); p.shadow.material.dispose(); p.state = 'gone'; }
function clearPlants(animated) {
  plants.forEach(p => { if (animated && p.state !== 'gone') { p.state = 'despawn'; p.t = 0; } else disposePlant(p); });
  if (!animated) plants = [];
}

  [...CROPS].sort(() => Math.random() - .5).forEach((d, i) => spawn('crop', d, .1 + i * stagger));
  for (let i = 0; i < WEED_COUNT; i++) spawn('weed', null, .2 + i * stagger);

    p.tilt.rotation.x = tiltAmt;

    const isHover = p === hovered && (p.state === 'idle');

        if (p.age >= p.life) { p.state = 'sink'; p.t = 0; if (p.kind === 'weed' && S.mode === 'play') missWeed(p); break; }
        const breathe = 1 + Math.sin(elapsed * 2.4 + p.ph) * .015;

        const f = Math.max(0, 1 - t / .5); p.mat.color.setRGB(1, 1 - .45 * f, 1 - .45 * f);
        if (t > .55) { p.state = 'leave'; p.t = 0; p.mat.color.setRGB(1, 1, 1); }
        break;
      }
      case 'leave': {
        // crop hops away to a new spot (original: removed & replanted)
        const k = clamp(p.t / .28, 0, 1), s = 1 - easeInOut(k);
        p.anim.scale.set(Math.max(.0001, s), Math.max(.0001, s * (1 + k * .4)), 1); p.anim.position.y = k * .4; p.shadow.scale.x = p.w * .95 * s;
        if (k >= 1) {
          disposePlant(p);
        }
        break;
      }
      case 'sink': {
        // ducks back into the soil
        const k = clamp(p.t / .22, 0, 1), e = k * k;
        p.anim.position.y = -p.h * .9 * e; p.anim.scale.set(Math.max(.0001, 1 - e * .5), Math.max(.0001, 1 - e * .3), 1);
        p.shadow.scale.x = p.w * .95 * Math.max(.0001, 1 - k);
        if (!p.puffed2) { p.puffed2 = true; burst(pos, 4, .35); }
        if (k >= 1) disposePlant(p);
        break;
      }
      case 'despawn': {
        const k = clamp(p.t / .24, 0, 1), s = 1 - k;
        p.anim.scale.set(Math.max(.0001, s), Math.max(.0001, s), 1); p.shadow.scale.x = p.w * .95 * Math.max(.0001, s);
        if (k >= 1) disposePlant(p);
        break;
      }
    }
  }
  // hover ring
  if (hovered && hovered.state === 'idle') {
    hoverRing.position.x = hovered.root.position.x; hoverRing.position.z = hovered.root.position.z;
    const s = hovered.w * 1.05 + Math.sin(elapsed * 6) * .05; hoverRing.scale.set(s, 1, s * .55);
    hoverRing.material.opacity += (.75 - hoverRing.material.opacity) * Math.min(1, dt * 12);
    hoverRing.material.color.set(hovered.kind === 'weed' ? 0xffffff : 0xffb3ba);
  } else hoverRing.material.opacity += (0 - hoverRing.material.opacity) * Math.min(1, dt * 12);
}
function updateFx(dt) {
  for (const p of particles) {
    if (!p.m.visible) continue;
    p.life += dt; if (p.life > p.max) { p.m.visible = false; continue; }
    p.v.y -= 15 * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < .04) { p.m.position.y = .04; p.v.y *= -.32; p.v.x *= .55; p.v.z *= .55; }
    p.m.rotation.x += dt * 6; p.m.rotation.y += dt * 4;
    const s = p.m.scale.x; if (p.life > p.max * .7) p.m.scale.setScalar(Math.max(.001, s * (1 - dt * 6)));
  }
  for (const h of holes) {
    if (!h.m.visible) continue; h.t += dt;
    const k = clamp(h.t / .15, 0, 1), fade = clamp(1 - (h.t - .9) / .9, 0, 1);
    h.m.scale.set(h.w * (.4 + .6 * k), 1, h.w * .55 * (.4 + .6 * k)); h.m.material.opacity = .85 * fade;
    if (fade <= 0) h.m.visible = false;
  }
  for (const r of rings) {
    if (!r.m.visible) continue; r.t += dt;
    const k = clamp(r.t / .45, 0, 1), s = .5 + 1.8 * (1 - Math.pow(1 - k, 3));
    r.m.scale.set(s, 1, s * .55); r.m.material.opacity = .9 * (1 - k);
    if (k >= 1) r.m.visible = false;
  }
}
function updateChars(dt) {
  const camPosW = camera.position;
  chars.forEach((c, i) => {
    c.vy -= 15 * dt; c.y = Math.max(0, c.y + c.vy * dt); if (c.y === 0) c.vy = Math.max(0, c.vy);
    const air = c.y > .001;
    const bob = air ? 0 : Math.abs(Math.sin(elapsed * 2.2 + c.ph)) * .045;
    const sq = air ? 1 + clamp(c.vy * .03, -.08, .1) : 1 - Math.sin(elapsed * 4.4 + c.ph * 2) * .015;
    c.root.position.set(c.base.x, c.y + bob, c.base.z);
    c.root.rotation.y = Math.atan2(camPosW.x - c.base.x, camPosW.z - c.base.z);
    c.tilt.rotation.x = -.3 * PITCH;
    c.anim.scale.set(1 / Math.sqrt(sq), sq, 1);
    c.wob = Math.max(0, c.wob - dt * 1.8);
    c.anim.rotation.z = Math.sin(elapsed * 1.6 + c.ph) * .03 + Math.sin(elapsed * 30) * .12 * c.wob;
    c.shadow.position.y = .015 - c.y - bob; // keep shadow on ground
    const ss = 1 - clamp(c.y * .35, 0, .5); c.shadow.scale.set(c.w * .85 * ss, 1, .55 * ss);
  });
}
function updateWorld(dt) {
  windUniform.value = elapsed;
  swayers.forEach(s => { s.obj.rotation.z = Math.sin(elapsed * 1.1 + s.ph) * s.amp; s.obj.rotation.x = Math.cos(elapsed * .9 + s.ph) * s.amp * .6; });
  clouds.forEach(c => { c.g.position.x += c.v * dt; if (c.g.position.x > 85) c.g.position.x = -85; });
  butterflies.forEach(b => {
    const t = elapsed * b.sp + b.ph;
    const x = b.cx + Math.sin(t) * b.rx, z = b.cz + Math.sin(t * 2) * b.rz, y = 1.2 + Math.sin(t * 3.3) * .35;
    const nx = b.cx + Math.sin(t + .05) * b.rx, nz = b.cz + Math.sin((t + .05) * 2) * b.rz;
    b.g.position.set(x, y, z); b.g.rotation.y = Math.atan2(nx - x, nz - z) - Math.PI / 2;
    const f = Math.sin(elapsed * 22 + b.ph) * 1.1;
    b.wl.rotation.z = .3 + f * .6; b.wr.rotation.z = -.3 - f * .6;
  });
}
function updateCamera(dt) {
  let want = new THREE.Vector3(), look = new THREE.Vector3();
  const inGame = S.mode === 'play' || S.mode === 'countdown' || S.mode === 'ending';
  introBlend += ((inGame ? 0 : 1) - introBlend) * Math.min(1, dt * 2.2);
  // intro / result: a slow cinematic sway around the garden
  const a = Math.sin(elapsed * .13) * .38 + mouse.x * .06;
  const R = 15.5 + Math.max(0, 1 - innerWidth / innerHeight) * 3.5, H = 5.2 - mouse.y * .4;
  const ip = new THREE.Vector3(Math.sin(a) * R, H, Math.cos(a) * R - 1.5), il = new THREE.Vector3(0, 1.0, -1.6);
  want.copy(playCam.pos).lerp(ip, introBlend); look.copy(playCam.target).lerp(il, introBlend);
  if (inGame && !isMobile) { want.x += mouse.x * .25; want.y -= mouse.y * .15; }
  camera.position.lerp(want, introBlend > .02 && introBlend < .98 ? 1 : Math.min(1, dt * 5));
  camTarget.lerp(look, Math.min(1, dt * 5));
  camera.lookAt(camTarget);
  if (shakeAmp > .001) {
    camera.position.x += (Math.random() - .5) * shakeAmp; camera.position.y += (Math.random() - .5) * shakeAmp;
    shakeAmp *= Math.pow(.0001, dt);
  }
}
function tickGame(dt) {
  if (S.mode !== 'play' || S.paused) return;
  S.clock += dt; S.time -= dt;
  updateTimer();
  const sec = Math.ceil(S.time);
  if (S.time <= 5 && !UI.timer.classList.contains('danger')) UI.timer.classList.add('danger');
  if (S.time <= 5 && sec !== S.lastTick && sec > 0) { S.lastTick = sec; SFX.tick(); }
  // combo meter decays over the combo window
  const left = clamp(1 - (S.clock - S.last) / COMBO_WINDOW, 0, 1);
  UI.meter.style.transform = `scaleX(${left})`;
  if (left <= 0 && S.combo > 1) { S.combo = 1; renderHud(); }
  // pop-up spawner: plants appear and vanish, faster as time runs out
  const prog = clamp(S.clock / GAME_TIME, 0, 1);
  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    const active = plants.filter(p => p.state === 'grow' || p.state === 'idle');
    if (active.length < Math.round(6 + prog * 3)) {
      const weeds = active.filter(p => p.kind === 'weed').length;
      spawnTimed(weeds < 2 ? 'weed' : (Math.random() < .64 ? 'weed' : 'crop'));
      S.spawnT = (.38 - .18 * prog) * rand(.75, 1.25);
    } else S.spawnT = .05;
  }
  if (S.time <= 0) { S.time = 0; updateTimer(); endGame(); }
}
function spawnTimed(kind, delay = 0) {
  const prog = clamp(S.clock / GAME_TIME, 0, 1);
  const life = (kind === 'weed' ? 2.05 - .9 * prog : 2.5 - .8 * prog) * rand(.88, 1.12);
  return spawn(kind, null, delay, life);
}
function missWeed(p) {
  S.missed++;
  if (S.combo > 1) { S.combo = 1; S.last = -9; renderHud(); }
  tone(300, 200, .12, 'sine', .05);
}
function frame() {
  const raw = Math.min(clock.getDelta(), .25), dt = Math.min(raw, 1 / 20);
  const simDt = S.paused ? 0 : Math.min(raw, .1);
  elapsed += dt;
  tickGame(raw); // real time for the exam clock, even on slow devices
  updatePlants(simDt);
  updateFx(simDt);
  updateChars(dt);
  updateWorld(dt);
  updateCamera(dt);
  updatePops(dt);
  renderer.render(scene, camera);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  layoutField();
  // keep plants inside the (possibly reshaped) plot
  plants.forEach(p => { p.root.position.x = clamp(p.root.position.x, -FW / 2 + .4, FW / 2 - .4); p.root.position.z = clamp(p.root.position.z, -FD / 2 + .3, FD / 2 - .3); });
}
addEventListener('resize', resize);

/* =========================================================
   Boot
   ========================================================= */
texReady.then(() => {
  buildChars();
  resize();
  camera.position.set(0, 6, 18); camTarget.set(0, 1, -1.6);
  populate(.06);
  updateBest();
  S.mode = 'intro';
  show('intro', true);
  renderer.setAnimationLoop(frame);
  setTimeout(() => { $('#loader').classList.add('done'); }, 120);
  setTimeout(() => [5, 4, 3, 2, 1].forEach(licenseReady), 1500);
});
// debug/test hook
window.__weed = { S, plants: () => plants, pick, camera, THREE };
</script>
